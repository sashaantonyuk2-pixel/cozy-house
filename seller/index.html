:root{--bg:#faf9f6;--paper:#fff;--ink:#27332b;--muted:#727a73;--sage:#647b67;--sage2:#eaf0e7;--forest:#385a46;--deep:#304b3d;--line:#e6e8e2;--terra:#b56e54;--terra2:#fbeee7;--shadow:0 12px 32px rgba(36,49,36,.08);--r:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
h1,h2,h3.serif{font-family:Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-.03em}
.shell{max-width:1220px;margin:auto;padding:0 24px}
.promo{background:var(--deep);color:#f4f1e6;text-align:center;padding:8px 15px;font-size:12.5px;letter-spacing:.03em}
.promo:empty{display:none}
.header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.headinner{display:flex;align-items:center;gap:28px;min-height:74px}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0}.brand img{height:46px;width:46px;border-radius:12px;object-fit:cover}
.brand strong{display:block;font-family:Georgia,serif;font-size:21px;letter-spacing:-.5px;font-weight:500;line-height:1.1}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.nav{display:flex;gap:24px;align-items:center;flex:1}.nav a{color:#48544a;font-weight:600;font-size:14px}.nav a.active,.nav a:hover{color:var(--terra)}
.actions{display:flex;gap:6px;align-items:center}
.iconbtn{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--sage2)}.iconbtn svg{width:21px;height:21px}
.badge{position:absolute;top:2px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--terra);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center}.badge:empty{display:none}
.lang{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 9px;font-size:12px;font-weight:800;color:var(--muted)}
.menu{display:none}
.btn{border:1px solid var(--line);background:#fff;padding:11px 18px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s;white-space:nowrap}
.btn:hover{box-shadow:var(--shadow);transform:translateY(-1px)}.btn.primary{background:var(--forest);border-color:var(--forest);color:#fff}.btn.terra{background:var(--terra);border-color:var(--terra);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.btn.block{width:100%}.btn.danger{color:#a3412b}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent}
/* hero */
.hero{background:linear-gradient(105deg,#f1f0e8 0%,#f4f1e9 58%,#e3e9df 100%);padding:56px 0}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:48px}
.eyebrow{text-transform:uppercase;color:#a16e56;letter-spacing:.18em;font-weight:800;font-size:11px}
.hero h1{font-size:clamp(38px,5vw,66px);line-height:1.05;margin:16px 0}.hero p{font-size:17px;color:#5f6b60;max-width:540px;white-space:pre-line}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.hero-art{aspect-ratio:1/0.9;border-radius:24px;overflow:hidden;position:relative;box-shadow:var(--shadow);background:#e9e4da}
.hero-art img{width:100%;height:100%;object-fit:cover}
.hero-note{position:absolute;left:18px;bottom:18px;background:#fffdf6;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;max-width:70%}
.hero-note b{display:block}
.perks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding-top:18px;padding-bottom:18px}
.perk{display:flex;gap:10px;align-items:center;font-size:12.5px;line-height:1.35;color:#566258;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:left;font-family:inherit;cursor:pointer;transition:border-color .15s,box-shadow .15s;min-width:0}.perk:hover,.perk:focus-visible{border-color:var(--terra);box-shadow:0 0 0 1px var(--terra)}.perk i{font-style:normal;width:32px;height:32px;border-radius:50%;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}.perk>span{min-width:0}.perk b{display:block;color:var(--ink);font-size:13.5px}.perkarr{font-style:normal;margin-left:auto;color:var(--terra);font-size:18px;line-height:1;padding-left:4px}
.section{padding-top:56px;padding-bottom:56px}.section.alt{background:#f1f3ed}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}.section-head h2{font-size:34px;margin:6px 0 0}
.textlink{color:var(--forest);font-weight:800;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.grid.cats{grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.cat{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:.2s;text-align:center}
.cat:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.cat .ph{aspect-ratio:1;background:#efece4}.cat .ph img{width:100%;height:100%;object-fit:cover}
.cat b{display:block;padding:12px 8px 13px;font-size:14px}.cat small{display:block;color:var(--muted);font-size:12px;padding-bottom:12px}
/* product card */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:.2s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card .ph{aspect-ratio:1;background:#efece4;position:relative;overflow:hidden}.card .ph img{width:100%;height:100%;object-fit:cover;transition:.4s}.card:hover .ph img{transform:scale(1.03)}
.card .body{padding:15px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:15.5px;margin:0;font-weight:650;line-height:1.35}
.card .catname{font-size:12px;color:var(--muted)}
.card .bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}
.price{font-weight:800;font-size:17px}.price.sale{color:var(--terra)}.old{color:#9aa19b;text-decoration:line-through;font-size:13px;font-weight:500;margin-left:6px}
.labels{position:absolute;top:12px;left:12px;display:flex;gap:6px;z-index:2}
.label{background:#fff;border-radius:20px;padding:4px 9px;font-size:11px;font-weight:800;box-shadow:0 2px 8px #0001}.label.sale{background:var(--terra);color:#fff}.label.out{background:#5c635d;color:#fff}.label.new{background:var(--forest);color:#fff}
.fav{position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:#fffe;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px #0001}
.fav svg{width:18px;height:18px}.fav.on svg{fill:var(--terra);stroke:var(--terra)}
.addbtn{width:40px;height:40px;border-radius:11px;border:0;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}.addbtn svg{width:19px;height:19px}.addbtn:disabled{background:#c9cec8}
/* page head */
.page-head{background:#eef1ea;padding:40px 0 34px}.page-head h1{font-size:42px;margin:6px 0}.page-head p{color:var(--muted);margin:0;max-width:680px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:6px}.crumbs a:hover{color:var(--terra)}
/* shop */
.shopbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:#fff;border-radius:30px;padding:8px 14px;font-size:13px;font-weight:700}.chip.on{background:var(--forest);border-color:var(--forest);color:#fff}
.field,.shopbar input,.shopbar select{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;min-width:0;width:100%}
.shopbar .search{flex:1;min-width:200px;position:relative}.shopbar .search input{padding-left:38px}.shopbar .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;color:var(--muted)}
.shopbar select{width:auto}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;white-space:nowrap}.check input{width:17px;height:17px;accent-color:var(--forest)}
.empty{text-align:center;padding:60px 20px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:var(--r)}.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
/* product page */
.pdp{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;padding:34px 0 20px}
.gallery .main{aspect-ratio:1;border-radius:20px;overflow:hidden;background:#efece4;border:1px solid var(--line)}.gallery .main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.thumbs button{width:76px;height:76px;padding:0;border-radius:12px;overflow:hidden;border:2px solid transparent;background:#efece4}.thumbs button.on{border-color:var(--forest)}.thumbs img{width:100%;height:100%;object-fit:cover}
.pdp h1{font-size:38px;margin:8px 0 10px;line-height:1.1}
.pdp .pricebox{display:flex;align-items:center;gap:10px;margin:16px 0}.pdp .price{font-size:28px}.pdp .old{font-size:17px}
.stock{font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}.stock:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}.stock.in{color:#3f7a4d}.stock.low{color:#b7792a}.stock.out{color:#8b8f8b}
.lead{color:#566258;font-size:16px}
.buyrow{display:flex;gap:10px;margin:22px 0}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}.qty button{width:40px;height:44px;border:0;background:transparent;font-size:18px}.qty input{width:44px;text-align:center;border:0;outline:0;background:transparent;-moz-appearance:textfield}.qty input::-webkit-inner-spin-button{display:none}
.infobox{border:1px solid var(--line);background:#fff;border-radius:14px;padding:16px 18px;margin-top:14px;font-size:14px;color:#566258;white-space:pre-line}.infobox b{color:var(--ink);display:block;margin-bottom:4px}
.desc{white-space:pre-line;color:#3f4a41}
.specs{width:100%;border-collapse:collapse;font-size:14px}.specs td{padding:9px 0;border-bottom:1px solid var(--line)}.specs td:first-child{color:var(--muted);width:42%}
.tabsec{padding:20px 0 30px;display:grid;grid-template-columns:1.2fr .8fr;gap:48px}.tabsec h2{font-size:26px;margin:0 0 12px}
/* cart */
.cartgrid{display:grid;grid-template-columns:1fr 360px;gap:30px;align-items:start;padding-top:34px;padding-bottom:60px}
.line{display:grid;grid-template-columns:88px 1fr auto;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.line img{width:88px;height:88px;border-radius:10px;object-fit:cover;background:#efece4}.line h3{font-size:15px;margin:0 0 4px}.line .unit{font-size:13px;color:var(--muted)}
.line .right{display:flex;flex-direction:column;align-items:end;gap:8px}.line .qty button{width:32px;height:34px}.line .qty input{width:34px}
.linkbtn{border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:0}
.summary{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;position:sticky;top:96px}.summary h3{margin:0 0 14px;font-size:18px}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px}.row.total{border-top:1px solid var(--line);margin-top:8px;padding-top:14px;font-size:18px;font-weight:800}
.muted{color:var(--muted)}.small{font-size:13px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form .full{grid-column:1/-1}
.form label,.lbl{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.field{display:block}textarea.field{min-height:90px;resize:vertical}
.field:focus,.shopbar input:focus,.shopbar select:focus{outline:2px solid #b7c9b4;border-color:#9fb59b}
.req{color:var(--terra)}
.radio{display:flex;flex-direction:column;gap:8px}.radio label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;font-weight:600;cursor:pointer;margin:0}.radio input{accent-color:var(--forest)}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px}
.panel h2{font-size:24px;margin:0 0 16px}
.note{background:var(--terra2);color:#8a5a45;padding:12px 15px;border-radius:12px;font-size:13.5px}
.okbox{background:#e8f1e6;color:#2f5b3a;padding:14px 16px;border-radius:12px}
.prose{max-width:760px;white-space:pre-line;font-size:16px;color:#3f4a41}
/* footer */
footer{background:#2a3c31;color:#d9e1d7;margin-top:30px}.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px;padding-top:46px;padding-bottom:30px}footer h4{color:#fff;margin:0 0 12px;font-size:14px}footer a,footer p{display:block;margin:0 0 8px;font-size:14px;color:#c8d3c6}footer a:hover{color:#fff}
.footlogo{font-family:Georgia,serif;font-size:22px;color:#fff;margin-bottom:8px}.copy{border-top:1px solid #ffffff1a;padding-top:16px;padding-bottom:16px;font-size:12px;color:#9fb09d;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;pointer-events:none;background:#24332a;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:100;transition:.25s;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px #0003}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}#toast a{color:#f3c9b6;font-weight:800}
/* admin */
.admin{display:grid;grid-template-columns:230px 1fr;gap:26px;padding:28px 0 60px;align-items:start}
.aside{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;position:sticky;top:96px}
.aside a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;font-weight:650;font-size:14px;color:#48544a}.aside a.on{background:var(--sage2);color:var(--forest)}.aside a:hover{background:#f4f6f1}
.aside hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.ahead{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}.ahead h1{font-size:32px;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.stat b{font-size:28px;font-family:Georgia,serif;font-weight:500;display:block}.stat span{color:var(--muted);font-size:13px}
.tablewrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px;border-bottom:1px solid var(--line);background:#fafbf8;white-space:nowrap}.t td{padding:10px 12px;border-bottom:1px solid #f0f1ed;vertical-align:middle}.t tr:last-child td{border-bottom:0}
.t img{width:46px;height:46px;border-radius:9px;object-fit:cover;background:#efece4}.t .nm b{display:block}.t .nm small{color:var(--muted)}
.t input.mini{width:96px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:#fff}.t input.mini.s{width:70px}
.t input.mini:focus{outline:2px solid #b7c9b4}
.t .acts{display:flex;gap:6px;justify-content:flex-end}
.switch{position:relative;width:40px;height:23px;display:inline-block}.switch input{opacity:0;width:0;height:0}.switch span{position:absolute;inset:0;background:#d3d7d1;border-radius:20px;transition:.2s;cursor:pointer}.switch span:before{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+span{background:var(--forest)}.switch input:checked+span:before{transform:translateX(17px)}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#f4f6f1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}.bulk input{width:80px}
.editor{display:grid;grid-template-columns:1.3fr .7fr;gap:20px;align-items:start}.editor .panel{margin-bottom:20px}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.imgbox{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#efece4}.imgbox img{width:100%;height:100%;object-fit:cover}
.imgbox .tools{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:5px;background:linear-gradient(transparent,#0006)}.imgbox .tools button{border:0;background:#fffe;border-radius:7px;width:26px;height:26px;font-size:13px;padding:0}
.imgbox .main-l{position:absolute;top:6px;left:6px;background:var(--forest);color:#fff;font-size:10px;font-weight:800;padding:3px 7px;border-radius:10px}
.drop{border:2px dashed #cdd5ca;border-radius:12px;padding:20px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer;background:#fbfcfa;display:block}.drop:hover,.drop.over{border-color:var(--forest);background:var(--sage2)}
.specrow{display:grid;grid-template-columns:1fr 1.4fr 36px;gap:8px;margin-bottom:8px}
.help{font-size:12.5px;color:var(--muted);margin-top:5px}
.stack>*+*{margin-top:14px}
.steps{counter-reset:s;padding:0;list-style:none}.steps li{counter-increment:s;padding-left:38px;position:relative;margin-bottom:12px}.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--sage2);color:var(--forest);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
@media (max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.cats{grid-template-columns:repeat(3,minmax(0,1fr))}.perks{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
 .nav{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;flex-direction:column;align-items:stretch;gap:0;border-bottom:1px solid var(--line);box-shadow:var(--shadow);padding:8px 16px}
 .nav.open{display:flex}.nav a{padding:13px 4px;border-bottom:1px solid #f0f1ed;font-size:15px}.nav a:last-child{border:0}
 .menu{display:inline-flex}.headinner{gap:10px;justify-content:space-between;min-height:64px}.brand img{width:40px;height:40px}.brand strong{font-size:19px}.brand small{display:none}
 .hero{padding:30px 0}.hero-grid,.pdp,.tabsec,.cartgrid,.editor,.admin{grid-template-columns:1fr}.hero-art{aspect-ratio:16/10}.hero-grid{gap:24px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card .body{padding:11px 12px 12px}.card h3{font-size:14px}.price{font-size:15px}.addbtn{width:36px;height:36px}
 .section{padding-top:38px;padding-bottom:38px}.section-head h2{font-size:27px}.page-head{padding:28px 0 24px}.page-head h1{font-size:32px}.pdp h1{font-size:30px}.pdp{gap:24px;padding-top:20px}
 .foot{grid-template-columns:1fr;gap:24px}.form{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.aside{position:static;display:flex;overflow:auto;padding:6px}.aside a{white-space:nowrap}.aside hr{display:none}.summary{position:static}
 .shell{padding:0 16px}.perks{gap:8px}.perk{font-size:11.5px;padding:8px 10px}.perk b{font-size:12.5px}
}
@media (max-width:420px){.perks{grid-template-columns:1fr 1fr}.perk i{width:28px;height:28px}.perkarr{display:none}.line{grid-template-columns:70px 1fr}.line img{width:70px;height:70px}.line .right{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}}

/* header search (Amazon-style) */
.headinner{gap:22px}
.hsearch{flex:1;min-width:0;display:flex;position:relative;max-width:760px;height:46px;border:2px solid var(--forest);border-radius:12px;background:#fff;transition:box-shadow .15s}
.hsearch:focus-within{box-shadow:0 0 0 4px #b56e5426;border-color:var(--terra)}
.hsearch select{border:0;border-right:1px solid var(--line);background:#f1f3ed;border-radius:10px 0 0 10px;padding:0 8px 0 12px;font-size:13px;font-weight:700;color:#48544a;max-width:150px;cursor:pointer;outline:0}
.hsearch input{flex:1;width:0;border:0;outline:0;padding:0 14px;font-size:16px;background:transparent;min-width:0}
.hsearch input::-webkit-search-cancel-button{cursor:pointer}
.hs-go{width:54px;border:0;background:var(--terra);color:#fff;border-radius:0 9px 9px 0;display:flex;align-items:center;justify-content:center}.hs-go:hover{background:#a45f47}.hs-go svg{width:21px;height:21px}
.hs-drop{position:absolute;top:calc(100% + 8px);left:-2px;right:-2px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 44px rgba(36,49,36,.16);z-index:60;max-height:72vh;overflow:auto;padding:6px}
.hs-label{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--muted);padding:8px 10px 4px}
.hs-label button{border:0;background:none;color:var(--forest);font-weight:700;font-size:12px;padding:0}
.hs-item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:7px 10px;border-radius:10px;cursor:pointer;color:var(--ink)}
.hs-item.on,.hs-item:hover{background:var(--sage2)}
.hs-item img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#efece4}
.hs-item .ic{width:44px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--muted)}.hs-item .ic svg{width:17px;height:17px}
.hs-item .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}.hs-item .tx small{display:block;color:var(--muted);font-size:12px}
.hs-item .pr{font-weight:800;font-size:14px;white-space:nowrap}.hs-item .pr.sale{color:var(--terra)}
.hs-item mark{background:none;color:inherit;font-weight:800}
.hs-item.q .tx{font-weight:600}.hs-item.q .tx em{font-style:normal;color:var(--terra)}
.hs-sep{height:1px;background:var(--line);margin:6px 4px}
.hs-empty{padding:14px 12px;color:var(--muted);font-size:14px}
.navbar{border-top:1px solid var(--line)}.navbar .nav{min-height:44px;gap:28px}
.summary,.aside{top:140px}
@media (max-width:860px){
 .headinner{flex-wrap:wrap;row-gap:0;padding-bottom:12px}.hsearch{order:3;flex-basis:100%;max-width:none;height:44px}

.admin>div,.editor>div{min-width:0}
/* layers */
body.locked{overflow:hidden}
.overlay{position:fixed;inset:0;background:rgba(29,42,34,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:80}.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#fff;z-index:90;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.12)}
.drawer.open{transform:none}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 14px 22px;border-bottom:1px solid var(--line)}.dhead h3{margin:0;font-size:19px;font-family:Georgia,serif;font-weight:500}
.dbody{flex:1;overflow:auto;padding:16px 22px}
.dfoot{border-top:1px solid var(--line);padding:16px 22px 20px;background:#fbfbf9}
.ship{background:#f4f6f1;border-radius:12px;padding:11px 13px;font-size:13px;margin-bottom:14px}.bar{height:6px;background:#e1e6dd;border-radius:6px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--forest);border-radius:6px;transition:width .3s}
.mline{display:grid;grid-template-columns:72px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid #f0f1ed;align-items:start}.mline:last-child{border:0}
.mline img{width:72px;height:72px;border-radius:10px;object-fit:cover;background:#efece4}.mn{display:block;font-weight:650;font-size:14px;line-height:1.3;margin-bottom:2px}.mt{font-size:14px;white-space:nowrap}
.mrow{display:flex;align-items:center;gap:12px;margin-top:8px}
.qty.sm button{width:30px;height:30px;font-size:16px}.qty.sm span{min-width:24px;text-align:center;font-weight:700;font-size:14px}.qty button:disabled{opacity:.35;cursor:default}
/* quick view */
.phw{position:relative}
.qvbtn{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;border:0;background:rgba(255,255,255,.95);color:var(--ink);font-weight:700;font-size:13px;padding:10px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.1);opacity:0;transform:translateY(6px);transition:.2s}
.card:hover .qvbtn,.qvbtn:focus-visible{opacity:1;transform:none}
@media (hover:none){.qvbtn{opacity:1;transform:none;left:auto;right:8px;bottom:8px;padding:7px 10px;font-size:12px}}
.modal{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.show{opacity:1;pointer-events:auto}
.modal .box{position:relative;background:#fff;border-radius:22px;width:100%;max-width:940px;max-height:calc(100vh - 48px);overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:32px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.25);transform:translateY(12px) scale(.98);transition:transform .25s}
.modal.show .box{transform:none}

.cattable .catsub .catpic{width:34px;height:34px;margin-left:12px}
.catpic img{width:100%!important;height:100%!important;margin:0!important;display:block}
.catpicov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(30,40,32,.45);color:#fff;font-size:15px;opacity:0;transition:opacity .15s}
.catpic:hover .catpicov,.catpic:focus-within .catpicov{opacity:1}
.catpic:focus-within{outline:2px solid var(--terra);outline-offset:2px}
.catsave{flex:none}.catsave:disabled{opacity:.45;cursor:default}
/* Seller · Товари: unsaved inline changes */
.t tr.dirty td{background:#fff8e8}
.t tr.dirty td:first-child{box-shadow:inset 3px 0 0 var(--terra)}
.pendbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(36,49,36,.18);padding:10px 12px 10px 16px;font-size:14px;max-width:calc(100vw - 24px)}
.pendbar.shake{animation:pshake .5s}
@keyframes pshake{20%,60%{transform:translateX(calc(-50% - 6px))}40%,80%{transform:translateX(calc(-50% + 6px))}}
/* product characteristics: shop filter checkboxes + colour swatches */
.swatch{display:inline-block;width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.15);vertical-align:-2px;margin-right:6px;flex:none}
.fopt.fchk span{display:flex;align-items:center}
.fbox{width:15px;height:15px;border-radius:4px;border:1.5px solid #9aa19a;margin-right:8px;flex:none;position:relative;background:#fff}
.fopt.fchk.on .fbox{background:var(--forest);border-color:var(--forest)}
.fopt.fchk.on .fbox:after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
/* Seller · Характеристики */
.attrlist{padding:6px 16px}
.attrrow{border-top:1px solid var(--line);padding:12px 0}.attrrow:first-child{border-top:0}
.attrsum{display:grid;grid-template-columns:170px minmax(0,1fr) 200px auto;gap:12px;align-items:center}
.attrsum[hidden]{display:none}
.attrname b{display:block;font-size:15px}.attrname small{display:block;margin-top:2px}
.tag{display:inline-flex;align-items:center;background:#f3f1ec;border-radius:999px;padding:3px 10px;margin:2px 4px 2px 0;font-size:12.5px}
.tag.c{background:var(--sage2);color:var(--forest);font-weight:600}
.attrgrid{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:16px;align-items:start}
.attrcats{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.attrcats .attrsub{padding-left:16px}
.attrpick{margin-bottom:10px}.attrpick b{display:block;font-size:13.5px;margin-bottom:6px}
.chip2{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;margin:0 6px 6px 0;cursor:pointer;font-size:13px;background:#fff;user-select:none}
.chip2 input{position:absolute;opacity:0;pointer-events:none}
.chip2.on{border-color:var(--forest);background:var(--sage2);font-weight:600}
.chip2:focus-within{outline:2px solid var(--terra);outline-offset:1px}
@media (max-width:900px){.attrsum{grid-template-columns:1fr}.attrgrid{grid-template-columns:1fr}}
/* Seller · Товари: tabs «Список товарів | Характеристики» */
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 18px;overflow-x:auto}
.subtabs a{padding:10px 14px;font-weight:600;font-size:14.5px;color:#566258;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtabs a:hover{color:var(--ink)}
.subtabs a.on{color:var(--ink);border-bottom-color:var(--terra)}
.subtabs .muted{font-weight:500;font-size:12.5px;margin-left:3px}
/* ===== home: category mosaic ===== */
.catmosaic{display:flex;flex-direction:column;gap:14px}
.ctile{position:relative;display:block;border-radius:var(--r);overflow:hidden;background:#efece4;isolation:isolate}
.ctile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.2,.7,.2,1);transform-origin:50% 60%}
.ctname{position:absolute;left:0;right:0;bottom:0;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:40px 16px 14px;color:#fff;font-weight:700;font-size:16px;line-height:1.25;background:linear-gradient(transparent,rgba(22,28,24,.62));text-shadow:0 1px 2px rgba(0,0,0,.25)}
.ctname em{font-style:normal;flex:none;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;text-shadow:none;transform:translateX(-4px);opacity:.85;transition:.25s}
.ctile.big .ctname{font-size:22px;font-family:Georgia,serif;font-weight:400;padding:60px 20px 18px}
.cm-top{display:grid;grid-template-columns:1.3fr 2fr;gap:14px}
.cm-small{display:grid;gap:14px;grid-template-rows:repeat(2,210px)}
.cm-k6 .cm-small{grid-template-columns:repeat(3,minmax(0,1fr))}
.cm-k4 .cm-small{grid-template-columns:repeat(2,minmax(0,1fr))}
.cm-top .big{min-height:434px}
.cm-row{display:flex;gap:14px}.cm-row .ctile{flex:1 1 0;min-width:0;height:230px}
@media (hover:hover){.ctile:hover img,.ctile:focus-visible img{transform:scale(1.07)}.ctile:hover .ctname em{transform:none;opacity:1}}
@media (hover:none){.ctile img{transition-duration:2.4s}.ctile.zin img{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.ctile img{transition:none;transform:none!important}}
@media (max-width:1050px){.cm-small{grid-template-rows:repeat(2,170px)}.cm-top .big{min-height:354px}.cm-row .ctile{height:190px}.ctname{font-size:14.5px;padding:34px 12px 12px}.ctile.big .ctname{font-size:19px}}
@media (max-width:700px){
 .catmosaic{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 .cm-top,.cm-small,.cm-row{display:contents}
 .catmosaic .ctile{height:auto;aspect-ratio:1;min-height:0}
 .catmosaic .ctile.big{grid-column:1/-1;aspect-ratio:16/10}
 .catmosaic .ctile.wide-m{grid-column:1/-1;aspect-ratio:16/8}
 .ctname{font-size:13.5px;padding:30px 10px 10px}.ctname em{width:24px;height:24px;font-size:13px}
 .ctile.big .ctname{font-size:19px;padding:44px 14px 14px}}
/* home: slim line above the category mosaic (the heading stays for screen readers and search engines) */
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.cathead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
.cathead .eyebrow{margin:0}
/* checkout: inactive payment placeholders */
.paystub{position:relative;opacity:.55;filter:grayscale(.25);user-select:none;pointer-events:none}
.paywallets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.paywallet{position:relative;height:46px;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:not-allowed;padding:0}
.paywallet.apple{background:#000;border-color:#000}
.paywallet svg{height:30px;width:auto}
.paysoon{position:absolute;top:-8px;right:8px;background:#fdf3dd;color:#8a5a0b;border:1px solid #f0d9a8;border-radius:999px;font-size:10.5px;font-weight:700;padding:1px 8px;letter-spacing:.02em}
.paycardwrap{position:relative}.paycardwrap>.paysoon{top:-9px;right:96px;z-index:1}
.payor{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin:14px 0 10px}.payor:before,.payor:after{content:"";flex:1;height:1px;background:var(--line)}
.paycard{border:0;padding:0;margin:0;display:grid;gap:8px;min-width:0}
.paycardrow{position:relative}.paycardrow .field{padding-right:92px}
.paycardbrands{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;gap:4px}.paycardbrands svg{width:32px;height:20px;border-radius:3px;box-shadow:0 0 0 1px var(--line)}
.paycardrow2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paycard .field:disabled{background:#f4f3ef;cursor:not-allowed}
.paynow{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--sage2);font-size:14px;line-height:1.45}
/* profile: password row with «Change password» */
.pwhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pwhead h2{margin:0 0 2px}.pwdots{letter-spacing:2px}
.pwpanel form{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
/* product card: large hover preview */
.cprev{position:fixed;z-index:65;width:420px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 22px 50px rgba(36,49,36,.22);padding:12px;display:none;opacity:0;transform:scale(.97);transition:opacity .18s,transform .18s}
.cprev.on{display:block;opacity:1;transform:none;animation:cpin .18s ease-out}
@keyframes cpin{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.cpimg{display:block;border-radius:12px;overflow:hidden;background:#efece4;aspect-ratio:1}
.cpmain{width:100%;height:100%;object-fit:cover;display:block}
.cpthumbs{display:flex;gap:6px;margin-top:8px}
.cpthumb{width:54px;height:54px;border-radius:9px;object-fit:cover;background:#efece4;border:2px solid transparent;cursor:pointer;opacity:.75;transition:.15s}
.cpthumb.on,.cpthumb:hover{border-color:var(--forest);opacity:1}
.cpinfo{display:flex;flex-direction:column;gap:2px;padding:10px 4px 2px;font-size:14px}
.cpinfo b{font-size:15px;line-height:1.3}
.cpinfo .price{font-weight:800}
@media (prefers-reduced-motion:reduce){.cprev,.cprev.on{animation:none;transition:none}}
/* My orders: period («archive») + pages */
.operiod{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin:0 0 16px;font-size:14.5px}
.operiod select.field{width:auto;padding:7px 34px 7px 12px}
.ocustom{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}.ocustom .field{width:auto;padding:6px 8px}
.opager{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0 4px}
.opager [aria-disabled]{opacity:.4;pointer-events:none}
.opnums{display:flex;gap:4px;align-items:center}
.opnums a,.opnums b{min-width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;font-size:14px}
.opnums a{color:var(--forest)}.opnums a:hover{background:var(--sage2)}
.opnums b{background:var(--forest);color:#fff}
/* product page: Amazon-style zoom */
.pdp{position:relative}
.zlens{position:absolute;z-index:3;pointer-events:none;display:none;background:rgba(255,255,255,.35);border:1px solid rgba(56,90,70,.55);border-radius:4px}
.zlens.on{display:block}
.zpane{position:absolute;z-index:30;display:none;background-color:#fff;background-repeat:no-repeat;border:1px solid var(--line);border-radius:16px;box-shadow:0 22px 50px rgba(36,49,36,.22);pointer-events:none}
.zpane.on{display:block}
.pdp .carslide img{cursor:crosshair}
.zoomhint{text-align:center;font-size:12.5px;color:var(--muted);margin:10px 0 0}
@media (hover:none),(max-width:899px){.zoomhint{display:none}.pdp .carslide img{cursor:zoom-in}}
/* ===== product page: Amazon-like layout — photo | details | buy box ===== */
.pdp3{grid-template-columns:minmax(0,460px) minmax(0,1fr) 280px;gap:32px;align-items:start}
.pdp3 .gallery{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;align-items:start;position:sticky;top:150px}
.pdp3 .gallery .car{grid-column:2;max-width:400px;width:100%}
.pdp3 .gallery .thumbs{grid-column:1;grid-row:1;flex-direction:column;flex-wrap:nowrap;gap:8px;margin:0;max-height:400px;overflow-y:auto;overflow-x:hidden;padding:0 2px 0 0}
.pdp3 .gallery .thumbs button{width:52px;height:52px;border-radius:9px}
.pdp3 .gallery .thumbs button.on{box-shadow:0 0 0 2px var(--terra);border-color:#fff}
.pdp3 .zoomhint{grid-column:2;max-width:400px}
.pdp3 .gallery:not(:has(.thumbs)) {grid-template-columns:minmax(0,1fr)}
.pdp3 .gallery:not(:has(.thumbs)) .car,.pdp3 .gallery:not(:has(.thumbs)) .zoomhint{grid-column:1}
.pdp3 h1{font-size:30px;line-height:1.2}
.pdp3 .pdinfo .pricebox{padding-top:10px;border-top:1px solid var(--line);margin-top:10px}
.buybox{border:1px solid var(--line);border-radius:16px;background:#fff;padding:18px;display:flex;flex-direction:column;gap:12px;position:sticky;top:150px}
.buybox .pricebox{margin:0}.buybox .price{font-size:26px}
.bbship{font-size:13.5px;color:#4a564c;line-height:1.45}
.buybox .stock{align-self:flex-start;margin:0}
.buybox .buyrow{margin:0;display:flex;gap:8px}.buybox .buyrow .qty{flex:1}
.buybox .btn.block{width:100%}
.bbmeta{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:4px 0 0;font-size:12.5px;color:var(--muted)}.bbmeta dd{margin:0;color:var(--ink)}
@media (max-width:1100px){.pdp3{grid-template-columns:minmax(0,420px) minmax(0,1fr)}.pdp3 .buybox{grid-column:2;position:static}.pdp3 .gallery{position:static}}
@media (max-width:860px){.pdp3{grid-template-columns:1fr}.pdp3 .buybox{grid-column:auto}
 .pdp3 .gallery{grid-template-columns:1fr}.pdp3 .gallery .car,.pdp3 .zoomhint{grid-column:1;max-width:none}.pdp3 .gallery .thumbs{grid-column:1;grid-row:auto;flex-direction:row;max-height:none;overflow-x:auto;overflow-y:hidden}}
.pdp3 .pdinfo>.muted.small{margin-left:0!important;display:block;margin-top:4px}
@media (min-width:861px) and (max-width:1100px){.pdp3 .gallery{grid-row:span 2}.pdp3{row-gap:18px}}
/* hover preview never takes clicks */
.cprev{pointer-events:none}
.cphint{font-size:11.5px;color:var(--muted);margin-top:6px}
/* ===== Seller · Замовлення: status colours, filters, pages ===== */
.s-new{--sc:#c0392b;--sb:#fdecea}.s-confirmed{--sc:#2f8a4a;--sb:#e8f5ec}.s-shipped{--sc:#2f6db0;--sb:#e8f0fa}
.s-completed{--sc:#5a6b5d;--sb:#eef1ec}.s-returned{--sc:#b0661f;--sb:#fdf1e4}.s-cancelled{--sc:#7c7c78;--sb:#f1f0ec}
.ostchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;align-items:center}
.ostchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:#48544a}
.ostchip[class*=" s-"]:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--sc)}
.ostchip b{font-weight:700;color:var(--muted);font-size:12px}
.ostchip.on{border-color:var(--forest);background:var(--sage2);color:var(--ink)}.ostchip[class*=" s-"].on{border-color:var(--sc);background:var(--sb)}
.ostsep{width:1px;height:22px;background:var(--line);margin:0 4px}
.ordbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 10px}
.ordbar .search{flex:1 1 280px;min-width:220px}
.ordsel{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}.ordsel .field{width:auto;padding:7px 30px 7px 10px}
.ordcustom{display:inline-flex;align-items:center;gap:6px}.ordcustom .field{width:auto;padding:6px 8px}
.ostlegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:0 0 10px}
.ostlegend span{display:inline-flex;align-items:center;gap:5px}.ostlegend i{width:10px;height:10px;border-radius:3px;background:var(--sb);box-shadow:inset 3px 0 0 var(--sc)}
.t tr.ordrow>td{background:var(--sb)}
.t tr.ordrow>td:first-child{box-shadow:inset 4px 0 0 var(--sc)}
.t tr.ordrow select[data-ach="ostatus"]{border-color:var(--sc);color:var(--sc);font-weight:700}
.ordcustom[hidden]{display:none!important}
.opager .small{margin-left:6px}
.shopbar.ordbar{margin-bottom:10px}.ordbar .ordsel select.field{width:auto}.ordbar .ordcustom input.field{width:auto}
/* Seller · Замовлення: lighter, thinner status styling */
.s-new{--sb:#fdf6f5}.s-confirmed{--sb:#f4faf6}.s-shipped{--sb:#f4f7fc}.s-completed{--sb:#f7f8f6}.s-returned{--sb:#fdf8f1}.s-cancelled{--sb:#f8f8f6}
.t tr.ordrow>td:first-child{box-shadow:inset 2px 0 0 var(--sc)}

.ostchips{gap:4px}
.ostchip{padding:4px 10px;font-size:12.5px;font-weight:500;border-color:#e6e7e1;gap:5px}
.ostchip[class*=" s-"]:before{width:7px;height:7px}
.ostchip b{font-weight:500;font-size:11.5px}
.ostchip.on,.ostchip[class*=" s-"].on{background:#fff;border-color:var(--sc,var(--forest));box-shadow:inset 0 0 0 1px var(--sc,var(--forest));color:var(--ink)}
.ostsep{height:16px}
.ostlegend{font-size:11.5px;gap:4px 12px}
.ostlegend i{width:7px;height:7px;border-radius:50%;background:var(--sc);box-shadow:none}
.t tr.ordrow select[data-ach="ostatus"]{min-width:158px}

.owarn{color:#9a5a3f}.odelay{color:#8a5a0b}
.t tr.ordrow select[data-ach="ostatus"]{width:auto!important;min-width:162px}
/* ===== Seller Central tables: Amazon-like — white, clear row dividers, content aligned to the top ===== */
.admin .tablewrap{border-color:#d5d9d9;border-radius:10px}
.admin .tablewrap .t th{background:#fff;color:#0f1111;font-size:12.5px;font-weight:700;letter-spacing:0;text-transform:none;padding:12px;border-bottom:1px solid #d5d9d9;vertical-align:bottom}

.t tr.ordrow>td:first-child{box-shadow:none}

.t tr.ordrow select[data-ach="ostatus"]{background-image:none;padding:5px 26px 5px 10px;font-size:12.5px;color:#3d4540;min-width:150px}

.admin .tablewrap .t td.nm{min-width:210px}.admin .tablewrap .t td.nm b{font-weight:700;color:var(--forest)}
/* ===== Seller tables: compact rows (colours kept) ===== */

.admin .tablewrap .t th{padding:9px 10px}
.admin .tablewrap .t img{width:40px;height:40px;border-radius:7px}
.admin .tablewrap .t .btn.sm{padding:5px 9px;font-size:12px}
.admin .tablewrap .t input.mini,.admin .tablewrap .t .mini{padding:5px 8px;font-size:13px}
/* orders: light status colour back, status word + select on one line */
.t tr.ordrow>td{background:var(--sb)}
.t tr.ordrow>td:first-child{box-shadow:inset 2px 0 0 var(--sc)}

.ostword{display:inline-block;margin:0 6px 0 0;font-size:12.5px;vertical-align:middle}
.t tr.ordrow select[data-ach="ostatus"]{display:inline-block;vertical-align:middle;min-width:0!important;width:auto!important;padding:3px 22px 3px 8px;font-size:12px;height:28px}
.t tr.ordrow .etarow{display:flex;align-items:center;gap:4px;margin-top:4px!important;font-size:0}

.t tr.ordrow>td:first-child small,.t tr.ordrow>td:first-child .paypill,.t tr.ordrow>td:first-child [class*="pay"]{margin-left:6px;vertical-align:middle}
.t tr.ordrow td.oitemscell{max-width:230px;overflow:hidden;text-overflow:ellipsis}
.t tr.ordrow td details{display:inline-block;vertical-align:middle}.t tr.ordrow td details[open]{white-space:normal}
.t tr.ordrow .etarow{display:inline-flex!important;margin:0 0 0 8px!important;vertical-align:middle}
.t tr.ordrow .owarn,.t tr.ordrow .odelay{display:inline-block;margin:0 0 0 8px;vertical-align:middle}
.t tr.ordrow td>div.small{display:inline-block;margin:0 0 0 8px!important;vertical-align:middle}
.t tr.ordrow .acts{flex-wrap:nowrap}
.t tr.ordrow .oicon{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-left:6px;border:0;padding:0;font-size:13px;cursor:help;vertical-align:middle;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #ecd9cf}
.t tr.ordrow .btn.ib{min-width:30px;padding:5px 7px;justify-content:center}
.t tr.ordrow .etarow input{width:118px}
/* orders list: tighter columns */
.t tr.ordrow td.onocell .opay{margin-top:2px;line-height:1}.t tr.ordrow td.onocell .opay>*{font-size:10.5px;padding:1px 7px;margin:0}
.t tr.ordrow td.onocell br{display:none}
.oacc{font-size:11px;opacity:.7}
.t tr.ordrow td.oitemscell{max-width:190px}
.t tr.ordrow select[data-ach="ostatus"]{color:var(--sc);font-weight:600;border-color:color-mix(in srgb,var(--sc) 35%,#e3e3dc)}
.oeta{display:inline-block;margin-left:8px;font-size:12px;color:#4a564c;vertical-align:middle}
.t tr.ordrow td>div.small{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.t tr.ordrow td.oitemscell{max-width:140px}
/* ===== Seller Central: full width — menu near the left edge, more room for work ===== */
@media (min-width:861px){
 .shell.admin,.shell.admin.navoff{max-width:none;padding-left:16px;padding-right:28px;gap:24px}
 .sellerhead{max-width:none;padding-left:16px;padding-right:28px}
}
@media (min-width:1500px){.t tr.ordrow td.oitemscell{max-width:300px}}@media (min-width:1800px){.t tr.ordrow td.oitemscell{max-width:420px}}
/* order status badge (status changes only through actions) */
.ostbadge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--sc);background:#fff;border:1px solid color-mix(in srgb,var(--sc) 30%,#e3e3dc);border-radius:999px;padding:3px 10px 3px 8px;vertical-align:middle;white-space:nowrap}
.ostbadge:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc)}
.o-prep{background:#eef3fb;color:#2f5f9e}
/* orders list: «Дії ▾» menu */
.actmenu{position:relative;display:inline-block}
.actmenu>summary{list-style:none;cursor:pointer;white-space:nowrap}.actmenu>summary::-webkit-details-marker{display:none}
.actmenu[open]>summary{border-color:var(--forest)}
.actlist{position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:220px;background:#fff;border:1px solid #d5d9d9;border-radius:10px;box-shadow:0 12px 28px rgba(36,49,36,.16);padding:6px;display:flex;flex-direction:column}
.actlist button,.actlist a{all:unset;display:block;padding:8px 12px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--ink);white-space:nowrap}
.actlist button:hover,.actlist a:hover,.actlist button:focus-visible,.actlist a:focus-visible{background:#f3f4f1}
.actlist .danger{color:#b0442c}
.actlist a{border-top:1px solid #eee;margin-top:4px;padding-top:10px;color:var(--forest);font-weight:600}
.tablewrap:has(.actmenu[open]){overflow:visible}
.t tr.ordrow select.actsel{width:auto;min-width:190px;padding:5px 28px 5px 10px;font-size:12.5px;border-color:#cfd3cc}
.t tr.ordrow select.actsel:focus{border-color:var(--forest)}
/* seller order page: contact the buyer */
.ocontact{margin-bottom:16px}
.occh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.ocform{display:grid;gap:8px}
.octpl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.octpl .chip2{margin:0;padding:4px 11px;font-size:12.5px}
.ocform textarea{min-height:170px;font-family:inherit}
.ocform .acts{align-items:center}
.ocform .acts{gap:12px;flex-wrap:wrap}
.ocvia{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.ocvia .chip2{margin:0}
.ocvia .chip2:has(input:disabled){opacity:.45;cursor:not-allowed}
.ocform input[name=subject][hidden]{display:none}
.field.invalid{border-color:#c0563a!important;box-shadow:0 0 0 3px #fbe3dc}
/* orders list: «Терміни» column */
.t tr.ordrow td.odates{font-size:12px;line-height:1.35}
.odl{display:block;color:#4a564c;white-space:nowrap}
.odl.late{color:#b0442c;font-weight:700}.odl.soon{color:#a0620f;font-weight:600}.odl.ok{color:#5f7a62}
.oddates{margin:6px 0 2px}.oddates .odl{font-size:13px}
@media (min-width:1500px){.t tr.ordrow td.oitemscell{max-width:230px}}@media (min-width:1800px){.t tr.ordrow td.oitemscell{max-width:380px}}.t tr.ordrow td.oitemscell{max-width:120px}
@media (min-width:1500px){.t tr.ordrow td.oitemscell{max-width:230px}}@media (min-width:1800px){.t tr.ordrow td.oitemscell{max-width:380px}}
.t tr.ordrow select.actsel{min-width:0;width:150px}
/* orders list: expand arrow at the start of the row */
.oexpth{width:34px}
.t tr.ordrow td.oexpcell{width:34px;padding-left:8px;padding-right:0}
.oexp{all:unset;cursor:pointer;width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#5f6b62;font-size:14px;transition:transform .15s,background .15s}
.oexp:hover{background:#eef0ec}.oexp:focus-visible{outline:2px solid var(--forest)}
.oexp.open{transform:rotate(90deg);color:var(--forest)}
.t tr.odetrow>td{background:#fff;padding:12px 16px 16px 50px;border-bottom:1px solid #e3e6e6;box-shadow:inset 2px 0 0 var(--sc)}
.odet{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:24px;align-items:start}
.odet h4{margin:0 0 6px;font-size:12.5px;color:var(--muted);font-weight:700}
.odet .small{line-height:1.7}
.t tr.ordrow.expanded>td{border-bottom-color:transparent}
.oexp{font-size:17px;color:#3d4540;width:26px;height:26px;border:1px solid #dfe2dc;background:#fff}.oexp.open{border-color:var(--forest)}
/* ===== partial orders: cancelled items, several parcels ===== */
.s-partial{--sc:#7a5bb0;--sb:#f6f2fb}
.oline.osel{grid-template-columns:20px 56px 1fr auto auto}.ocheck input{width:16px;height:16px}
.oline.ocanc img{opacity:.45;filter:grayscale(1)}.oline.ocanc b a,.oline.ocanc>div>b{text-decoration:line-through;color:#8a8a82}
.ocnote{color:#9a3d2a}.opkg{color:#2f6db0}
.ociq{display:inline-flex;align-items:center;gap:6px;margin-top:4px}.ociq .field{width:64px;padding:3px 6px}
.ocibar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;padding:10px 0 4px;border-bottom:1px solid var(--line)}.ocibar>span{flex:1 1 220px}.ocibar .field{width:auto;padding:6px 8px}
.shipmode{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%}.shipmode .chip2 input{margin-right:4px}
.shiplines{display:flex;flex-direction:column;gap:4px;flex-basis:100%;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:10px}
.shipline{display:flex;align-items:center;gap:8px;font-size:13px}.shipline>span:first-of-type{flex:1}.shipform .shipline input.field{min-width:0;width:64px;padding:3px 6px}
.pkglist{display:flex;flex-direction:column;gap:8px;margin:8px 0}.pkg{border:1px solid var(--line);border-left:3px solid #2f6db0;border-radius:8px;padding:6px 10px;background:#fff;line-height:1.6}
.odet .pkglist{margin:6px 0 0}.odet .pkg{padding:4px 8px}
.ocancel{display:block;color:#9a3d2a;margin-top:2px}
.oditem.odcanc img,.otrk-items .odcanc{opacity:.6}.oditem.odcanc .ocname,.otrk-items .odcanc>span:first-child{text-decoration:line-through}
.otrk-pkgs{display:flex;flex-direction:column;gap:8px;margin-top:12px}.otrk-pkg{border:1px solid var(--line);border-left:3px solid #2f6db0;border-radius:10px;padding:8px 12px;background:#fff;line-height:1.6}
.shipform.stack{align-items:flex-start}.shipform.stack .shiplines,.shipform.stack .shipmode{align-self:stretch}
.fav-inline.on svg{fill:var(--terra);stroke:var(--terra)}

privacyText:"Last updated: November 25, 2026\n\nThis Privacy Policy explains how {store} (\"we\", \"us\") collects, uses and protects your personal information when you visit {site} or buy from us. {store} is operated by [Business legal name], {address}.\n\n## Information we collect\n- **Contact details** you give us: name, email, phone number and shipping address when you place an order, create an account, send us a message or chat with us.\n- **Chat messages** you send through the chat on our site.\n- **Order details:** the products you buy, order totals and delivery information.\n- **Account details:** your email and a password (stored securely and never visible to us), plus any saved address.\n- **Reviews** you choose to publish, shown with the name you enter.\n- **Basic technical data** your browser sends automatically (such as device and browser type).\n\nYour cart and recent searches are saved only in your own browser (your wishlist is also saved in your account if you have one).\n\n## How we use your information\n- To process, ship and deliver your orders and handle returns.\n- To reply to your questions (by chat or email) and send messages about your order.\n- To run your account and keep the store secure.\n- To meet our legal, tax and accounting obligations.\n\nWe do not sell or rent your personal information, and we do not share it for cross-context behavioral advertising.\n\n## Who we share it with\nOnly with service providers that help us run the store, and only as needed: our hosting and database provider, our payment provider (we never see or store your full card number), and shipping carriers (name, address and phone for delivery). We may also disclose information if the law requires it.\n\n## Cookies and similar technology\nWe use your browser's local storage for essential features such as your cart and sign-in.\n\nWe also keep **anonymous visit statistics** to understand how the store is used: which pages and products are viewed, what is added to the cart, what is searched for on our site, which website or link brought you here (for example Instagram or Google) and your device type (phone, tablet or computer). This uses a random visit number stored in your browser — no cookies, no name, email or IP address, and it is never used for advertising or shared with anyone. Visit statistics are kept for up to 2 years.\n\nWe don't use advertising cookies. If we add advertising tools, we will update this policy and ask for your consent where required.\n\n## How long we keep it\nWe keep order records for as long as needed for tax and accounting purposes (usually up to 7 years). You can ask us to delete your account at any time.\n\n## Your rights\nYou can ask us to access, correct or delete your personal information, or to stop sending you marketing messages. California residents have additional rights under the CCPA/CPRA, including the right to know what we collect and the right not to be discriminated against for using these rights. To make a request, email us at {email}. We will respond within 45 days.\n\n## Children\nOur store is not directed to children under 13, and we do not knowingly collect their information.\n\n## Changes\nWe may update this policy from time to time. The date at the top shows the latest version.\n\n## Contact\nQuestions about privacy? Email {email}.",
termsText:"Last updated: November 24, 2026\n\nThese Terms of Service apply to your use of {store} at {site} and to any purchase you make from us. {store} is operated by [Business legal name], {address}. By using the site or placing an order, you agree to these terms.\n\n## Products and pricing\nWe try to describe and photograph every product accurately. Colors may look slightly different on your screen, and handmade items can vary a little from piece to piece. Prices are shown in U.S. dollars and may change at any time. If a product is listed at an incorrect price, we may cancel the order and refund you in full.\n\n## Orders\nYour order is an offer to buy. We accept it when we confirm it or ship it. We may refuse or cancel an order — for example, if an item is out of stock, the price was wrong, or we suspect fraud. If we cancel after you've paid, you'll get a full refund.\n\n## Payment\nPayment is due when you place your order unless we agree otherwise. Applicable sales tax may be added at checkout.\n\n## Shipping\nWe ship within the United States. Delivery times are estimates and are not guaranteed. Risk of loss passes to you when the package is delivered to the carrier-confirmed address. See Shipping & payment for details.\n\n## Returns\nReturns and refunds are covered by our Returns & Refunds policy.\n\n## Your account\nKeep your password safe. You are responsible for activity on your account. Let us know right away at {email} if you think someone else has used it.\n\n## Reviews and content\nIf you post a review, you confirm it reflects your genuine experience, and you give us permission to display it on our site. We may remove content that is false, offensive or unrelated to the product.\n\n## Intellectual property\nThe site's text, photos, logo and design belong to {store} or its licensors and may not be copied without permission.\n\n## Limitation of liability\nTo the fullest extent permitted by law, our total liability for any claim related to a purchase is limited to the amount you paid for that order. We are not liable for indirect or consequential damages. Nothing in these terms limits rights you have under consumer protection law.\n\n## Governing law\nThese terms are governed by the laws of the State of [State], USA.\n\n## Changes\nWe may update these terms. The version posted when you place an order applies to that order.\n\n## Contact\n{email}",
returnsText:"Last updated: November 25, 2026\n\nWe want you to love what you ordered. If something isn't right, here's how returns work.\n\n## 14-day returns\nYou can return items within **14 days of delivery**. Returns open once your order is delivered — start yours in your account: **My orders → Return items**. If you checked out as a guest, email us at {email} with your order number (it starts with CHV-).\n\n## Cancel before it ships\nChanged your mind before your order ships? Cancel it yourself in **My orders → Cancel order** (or on the **Track your order** page with your order number and email). If you've already paid, we'll refund you in full within 5 business days. Once an order has shipped it can't be cancelled — you can return it after delivery.\n\n## Reasons for return\n- Found a better price\n- Item arrived in poor condition\n- Defective item\n- Doesn't look as expected\n\n## Return conditions\n- Add **photos or a video** of the item and its packaging to your request. For a defect or damage, please show it clearly.\n- Items must be unused and keep their original condition and appearance, in the **original packaging** with all tags, parts and accessories.\n- Please report items damaged in transit within 48 hours of delivery.\n\n## Who pays for return shipping\n- **Defective item or item arrived in poor condition** — the return is **free**. We'll email you a prepaid return label and refund the item price plus the original shipping.\n- **Found a better price or doesn't look as expected** — return shipping is **paid by you**, and original shipping charges aren't refundable.\n\n## Items we can't accept\n- Candles that have been burned\n- Items that show signs of use, or damage that happened after delivery\n- Final-sale items (marked as such on the product page)\n\n## How it works\n- Send your request from **My orders** with the items, the reason and photos or a video.\n- We'll review it and reply by email within 1–2 business days with instructions.\n- Pack the items in their original packaging and ship them back. Please keep your tracking number.\n- Once we receive and check your return, we'll refund the item price and the sales tax paid on it to your original payment method within 5 business days. Your bank may take a few more days to show it.\n\n## Exchanges\nThe quickest way to get a different color or size is to return the item and place a new order.\n\n## Questions\nEmail {email} — we're happy to help.",

 ["mousemove","keydown","click","touchstart","scroll"].forEach(ev=>document.addEventListener(ev,()=>{this.lastAct=Date.now()},{passive:true}));
 setInterval(()=>{if(this.state!=="login"&&this.state!=="loading"&&Date.now()-this.lastAct>IDLE_MIN*60000){this.signOut("Ви вийшли автоматично після 30 хвилин бездіяльності.")}},30000);

 this.email=s.user.email;

 if(error||!adm){this.state="noaccess";return this.render0()}
 const{data:aal}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
 if(aal&&aal.currentLevel==="aal2"){
  try{S=await this.loadSup(await fetchCatalog());this.snapshot();this.state="ready";LS.set("noTrack",true);this.chrome();if(!/^#\/admin/.test(location.hash))location.hash="#/admin";else render()}
  catch(e){this.state="error";this.msg=e.message;this.render0()}
  return}
 const{data:f}=await sb.auth.mfa.listFactors();
 const verified=(f&&f.totp||[]).filter(x=>x.status==="verified");
 if(verified.length){this.factorId=verified[0].id;this.state="challenge"}else{this.state="enroll";this.enroll=null}
 this.render0()},

 else if(this.state==="noaccess")h=this.box("Немає доступу","",`<div class="note">Акаунт <b>${esc(this.email)}</b> не має доступу до кабінету продавця.</div><button class="btn block" style="margin-top:12px" data-act="a:signout">Вийти</button>`);
 else if(this.state==="challenge")h=this.box("Код підтвердження","Відкрийте застосунок-автентифікатор і введіть 6-значний код для CozyHouseVibe.",`<form class="stack" data-form="s:verify" novalidate>

async startEnroll(){

 catch(e){this.state="error";this.msg="Не вдалося налаштувати 2FA: "+e.message;this.render0()}},

  if(error)return this.sMsg(/Invalid login/i.test(error.message)?"Невірний email або пароль.":esc(authErr(error)));

 }catch(e){btn.disabled=false;this.sMsg(esc(e.message))}},

/* supplier data lives in its own admin-only table (product_suppliers) and is merged into S.products here */
async loadSup(st){let m={};st.suppliers=[];try{const[a,b]=await Promise.all([sb.from("product_suppliers").select("product_id,supplier_id,supplier_sku,cost_price,supplier_url"),sb.from("suppliers").select("*").order("name")]);if(a.error)throw a.error;if(b.error)throw b.error;(a.data||[]).forEach(r=>m[r.product_id]=r);st.suppliers=b.data||[]}catch(e){console.warn("suppliers load failed",e&&e.message)}
 st.products.forEach(p=>{const r=m[p.id]||{};p.supplierId=r.supplier_id||"";p.supplierSku=r.supplier_sku||"";p.cost=r.cost_price==null?null:+r.cost_price;p.supplierUrl=r.supplier_url||""});return st},
queueSync(){if(this.state!=="ready")return;this.dirty=true;this.pill("Збереження…","busy");clearTimeout(this.tm);this.tm=setTimeout(()=>this.flush(),500)},
async upload(dataUrl,prefix){
 const blob=await (await fetch(dataUrl)).blob();const ext=blob.type==="image/png"?"png":blob.type==="image/webp"?"webp":"jpg";
 const path=`${prefix}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
 const{error}=await sb.storage.from("product-images").upload(path,blob,{contentType:blob.type||"image/jpeg",cacheControl:"31536000",upsert:false});
 if(error)throw error;return sb.storage.from("product-images").getPublicUrl(path).data.publicUrl},
async flush(){
 if(this.syncing){this.again=true;return}
 this.syncing=true;this.dirty=false;
 try{
  for(const p of S.products)for(let i=0;i<(p.images||[]).length;i++)if(String(p.images[i]).startsWith("data:"))p.images[i]=await this.upload(p.images[i],"products/"+p.id);
  for(const c of S.categories)if(String(c.image||"").startsWith("data:"))c.image=await this.upload(c.image,"categories");
  if(String(S.settings.heroImage||"").startsWith("data:"))S.settings.heroImage=await this.upload(S.settings.heroImage,"site");
  if(String(S.settings.heroImageMobile||"").startsWith("data:"))S.settings.heroImageMobile=await this.upload(S.settings.heroImageMobile,"site");
  const cats=S.categories.map((c,i)=>({id:c.id,name:c.name,image:c.image||null,position:i,parent_id:c.parent||null}));
  const cUp=cats.filter(c=>this.synced.c[c.id]!==JSON.stringify(c));
  if(cUp.length){const{error}=await sb.from("categories").upsert(cUp);if(error)throw error}
  const rows=S.products.map(toRow);
  const pNew=rows.filter(r=>!this.synced.p[r.id]);
  if(pNew.length){const{error}=await sb.from("products").insert(pNew);if(error)throw error}
  for(const r of rows){const prev=this.synced.p[r.id];if(!prev||prev===JSON.stringify(r))continue;
   const was=JSON.parse(prev),ch={};for(const k in r)if(JSON.stringify(r[k])!==JSON.stringify(was[k]))ch[k]=r[k];
   if(Object.keys(ch).length){const{error}=await sb.from("products").update(ch).eq("id",r.id);if(error)throw error}}
  const sUp=S.products.map(supRow).filter(r=>{const prev=this.synced.sp[r.product_id];return prev!==JSON.stringify(r)&&(hasSup(r)||(prev&&hasSup(JSON.parse(prev))))});
  if(sUp.length){const{error}=await sb.from("product_suppliers").upsert(sUp);if(error)throw error}
  const pDel=Object.keys(this.synced.p).filter(id=>!S.products.some(p=>p.id===id));
  if(pDel.length){const{error}=await sb.from("products").delete().in("id",pDel);if(error)throw error}
  const cDel=Object.keys(this.synced.c).filter(id=>!S.categories.some(c=>c.id===id));
  if(cDel.length){const{error}=await sb.from("categories").delete().in("id",cDel);if(error)throw error}
  if(JSON.stringify(S.settings)!==this.synced.s){const{error}=await sb.from("store_settings").update({data:S.settings}).eq("id",1);if(error)throw error}
  this.snapshot();this.pill("✓ Усі зміни збережено","ok");
 }catch(e){this.dirty=true;this.pill("⚠ Не збережено — повтор…","err");toast("⚠️ Не вдалося зберегти: "+(e.message||e));
  if(/JWT|aal|row-level|permission/i.test(e.message||"")){this.syncing=false;return this.check()}
  clearTimeout(this.tm);this.tm=setTimeout(()=>this.flush(),5000)}
 finally{this.syncing=false;if(this.again){this.again=false;this.flush()}}}
};
Seller.refresh=async function(){
 if(this.state!=="ready"||this.dirty||this.syncing||(window.Admin&&Admin.pendIds&&Admin.pendIds().length))return;
 try{const st=await this.loadSup(await fetchCatalog());if(this.dirty||this.syncing)return;const changed=JSON.stringify(st)!==JSON.stringify(S);S=st;this.snapshot();
  if(changed&&/^#\/admin(\/products|\/categories)?\/?(\?.*)?$/.test(location.hash)&&!document.activeElement.matches("input,textarea,select"))render()}catch(e){}};
const supRow=p=>({product_id:p.id,supplier_id:p.supplierId||null,supplier_sku:String(p.supplierSku||"").trim()||null,cost_price:p.cost==null||p.cost===""||isNaN(+p.cost)?null:Math.round(+p.cost*100)/100,supplier_url:String(p.supplierUrl||"").trim()||null});
const hasSup=r=>!!(r.supplier_id||r.supplier_sku||r.cost_price!=null||r.supplier_url);
window.Seller=Seller;
addEventListener("beforeunload",e=>{if(window.Admin&&((Admin.pendIds&&Admin.pendIds().length)||(Admin.edDirty&&document.querySelector('[data-form="product"]')))){e.preventDefault();e.returnValue=""}});
function refreshAdminCatalog(){setTimeout(()=>Seller.refresh(),400)}
setInterval(()=>{if(document.visibilityState==="visible")Seller.refresh()},60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")Seller.refresh()});

/* ===== Seller Central (seller/index.html): connection, router, events, boot ===== */
function sbInit(){
 try{if(!window.supabase||!window.supabase.createClient)return;
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{flowType:"pkce",persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storage:window.sessionStorage,storageKey:"chv-seller-auth"}});
  sb.auth.onAuthStateChange(ev=>{setTimeout(()=>window.Seller&&Seller.onAuth(ev),0)});
 }catch(e){sb=null}}
function save(){if(window.Seller)Seller.queueSync()}
function load(){S=normalize(demoState())} /* real data is loaded by Seller after sign-in */
function chrome(){return Seller.chrome()}
function render(){const h=location.hash.slice(1)||"/";const[path,qs]=h.split("?");const q=new URLSearchParams(qs||"");Seller.render(path.split("/").filter(Boolean),q,path)}

document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act;
 if(a==="pw"){const i=el.parentNode.querySelector("input");i.type=i.type==="password"?"text":"password";el.textContent=i.type==="password"?"Show":"Hide"}
 else if(a.startsWith("a:"))Admin.click(a.slice(2),el,e)});
document.addEventListener("change",e=>{if(e.target.dataset.ach)Admin.change(e.target)});
document.addEventListener("submit",e=>{const f=e.target;const k=f.dataset.form;if(!k)return;e.preventDefault();
 if(k.startsWith("s:"))Seller.submit(k.slice(2),f);else Admin.submit(k,f)});
window.addEventListener("hashchange",render);

(async()=>{sbInit();load();document.documentElement.lang="uk";chrome();Seller.boot()})();

</script>
