:root{--bg:#faf9f6;--paper:#fff;--ink:#27332b;--muted:#727a73;--sage:#647b67;--sage2:#eaf0e7;--forest:#385a46;--deep:#304b3d;--line:#e6e8e2;--terra:#b56e54;--terra2:#fbeee7;--shadow:0 12px 32px rgba(36,49,36,.08);--r:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
h1,h2,h3.serif{font-family:Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-.03em}
.shell{max-width:1220px;margin:auto;padding:0 24px}
.promo{background:var(--deep);color:#f4f1e6;text-align:center;padding:8px 15px;font-size:12.5px;letter-spacing:.03em}
.promo:empty{display:none}
.header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.headinner{display:flex;align-items:center;gap:28px;min-height:74px}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0}.brand img{height:46px;width:46px;border-radius:12px;object-fit:cover}
.brand strong{display:block;font-family:Georgia,serif;font-size:21px;letter-spacing:-.5px;font-weight:500;line-height:1.1}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.nav{display:flex;gap:24px;align-items:center;flex:1}.nav a{color:#48544a;font-weight:600;font-size:14px}.nav a.active,.nav a:hover{color:var(--terra)}
.actions{display:flex;gap:6px;align-items:center}
.iconbtn{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--sage2)}.iconbtn svg{width:21px;height:21px}
.badge{position:absolute;top:2px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--terra);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center}.badge:empty{display:none}
.lang{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 9px;font-size:12px;font-weight:800;color:var(--muted)}
.menu{display:none}
.btn{border:1px solid var(--line);background:#fff;padding:11px 18px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s;white-space:nowrap}
.btn:hover{box-shadow:var(--shadow);transform:translateY(-1px)}.btn.primary{background:var(--forest);border-color:var(--forest);color:#fff}.btn.terra{background:var(--terra);border-color:var(--terra);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.btn.block{width:100%}.btn.danger{color:#a3412b}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent}
/* hero */
.hero{background:linear-gradient(105deg,#f1f0e8 0%,#f4f1e9 58%,#e3e9df 100%);padding:56px 0}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:48px}
.eyebrow{text-transform:uppercase;color:#a16e56;letter-spacing:.18em;font-weight:800;font-size:11px}
.hero h1{font-size:clamp(38px,5vw,66px);line-height:1.05;margin:16px 0}.hero p{font-size:17px;color:#5f6b60;max-width:540px;white-space:pre-line}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.hero-art{aspect-ratio:1/0.9;border-radius:24px;overflow:hidden;position:relative;box-shadow:var(--shadow);background:#e9e4da}
.hero-art img{width:100%;height:100%;object-fit:cover}
.hero-note{position:absolute;left:18px;bottom:18px;background:#fffdf6;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;max-width:70%}
.hero-note b{display:block}
.perks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding-top:18px;padding-bottom:18px}
.perk{display:flex;gap:10px;align-items:center;font-size:12.5px;line-height:1.35;color:#566258;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:left;font-family:inherit;cursor:pointer;transition:border-color .15s,box-shadow .15s;min-width:0}.perk:hover,.perk:focus-visible{border-color:var(--terra);box-shadow:0 0 0 1px var(--terra)}.perk i{font-style:normal;width:32px;height:32px;border-radius:50%;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}.perk>span{min-width:0}.perk b{display:block;color:var(--ink);font-size:13.5px}.perkarr{font-style:normal;margin-left:auto;color:var(--terra);font-size:18px;line-height:1;padding-left:4px}
.section{padding-top:56px;padding-bottom:56px}.section.alt{background:#f1f3ed}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}.section-head h2{font-size:34px;margin:6px 0 0}
.textlink{color:var(--forest);font-weight:800;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.grid.cats{grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.cat{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:.2s;text-align:center}
.cat:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.cat .ph{aspect-ratio:1;background:#efece4}.cat .ph img{width:100%;height:100%;object-fit:cover}
.cat b{display:block;padding:12px 8px 13px;font-size:14px}.cat small{display:block;color:var(--muted);font-size:12px;padding-bottom:12px}
/* product card */

footer{background:#2a3c31;color:#d9e1d7;margin-top:30px}.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px;padding-top:46px;padding-bottom:30px}footer h4{color:#fff;margin:0 0 12px;font-size:14px}footer a,footer p{display:block;margin:0 0 8px;font-size:14px;color:#c8d3c6}footer a:hover{color:#fff}

.pendbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(36,49,36,.18);padding:10px 12px 10px 16px;font-size:14px;max-width:calc(100vw - 24px)}
.pendbar.shake{animation:pshake .5s}
@keyframes pshake{20%,60%{transform:translateX(calc(-50% - 6px))}40%,80%{transform:translateX(calc(-50% + 6px))}}
/* product characteristics: shop filter checkboxes + colour swatches */
.swatch{display:inline-block;width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.15);vertical-align:-2px;margin-right:6px;flex:none}
.fopt.fchk span{display:flex;align-items:center}
.fbox{width:15px;height:15px;border-radius:4px;border:1.5px solid #9aa19a;margin-right:8px;flex:none;position:relative;background:#fff}
.fopt.fchk.on .fbox{background:var(--forest);border-color:var(--forest)}
.fopt.fchk.on .fbox:after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
/* Seller · Характеристики */
.attrlist{padding:6px 16px}
.attrrow{border-top:1px solid var(--line);padding:12px 0}.attrrow:first-child{border-top:0}
.attrsum{display:grid;grid-template-columns:170px minmax(0,1fr) 200px auto;gap:12px;align-items:center}
.attrsum[hidden]{display:none}
.attrname b{display:block;font-size:15px}.attrname small{display:block;margin-top:2px}
.tag{display:inline-flex;align-items:center;background:#f3f1ec;border-radius:999px;padding:3px 10px;margin:2px 4px 2px 0;font-size:12.5px}
.tag.c{background:var(--sage2);color:var(--forest);font-weight:600}
.attrgrid{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:16px;align-items:start}
.attrcats{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.attrcats .attrsub{padding-left:16px}
.attrpick{margin-bottom:10px}.attrpick b{display:block;font-size:13.5px;margin-bottom:6px}
.chip2{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;margin:0 6px 6px 0;cursor:pointer;font-size:13px;background:#fff;user-select:none}
.chip2 input{position:absolute;opacity:0;pointer-events:none}
.chip2.on{border-color:var(--forest);background:var(--sage2);font-weight:600}
.chip2:focus-within{outline:2px solid var(--terra);outline-offset:1px}
@media (max-width:900px){.attrsum{grid-template-columns:1fr}.attrgrid{grid-template-columns:1fr}}
/* Seller · Товари: tabs «Список товарів | Характеристики» */
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 18px;overflow-x:auto}
.subtabs a{padding:10px 14px;font-weight:600;font-size:14.5px;color:#566258;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtabs a:hover{color:var(--ink)}
.subtabs a.on{color:var(--ink);border-bottom-color:var(--terra)}
.subtabs .muted{font-weight:500;font-size:12.5px;margin-left:3px}
/* ===== home: category mosaic ===== */
.catmosaic{display:flex;flex-direction:column;gap:14px}
.ctile{position:relative;display:block;border-radius:var(--r);overflow:hidden;background:#efece4;isolation:isolate}
.ctile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.2,.7,.2,1);transform-origin:50% 60%}
.ctname{position:absolute;left:0;right:0;bottom:0;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:40px 16px 14px;color:#fff;font-weight:700;font-size:16px;line-height:1.25;background:linear-gradient(transparent,rgba(22,28,24,.62));text-shadow:0 1px 2px rgba(0,0,0,.25)}
.ctname em{font-style:normal;flex:none;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;text-shadow:none;transform:translateX(-4px);opacity:.85;transition:.25s}
.ctile.big .ctname{font-size:22px;font-family:Georgia,serif;font-weight:400;padding:60px 20px 18px}
.cm-top{display:grid;grid-template-columns:1.3fr 2fr;gap:14px}
.cm-small{display:grid;gap:14px;grid-template-rows:repeat(2,210px)}
.cm-k6 .cm-small{grid-template-columns:repeat(3,minmax(0,1fr))}
.cm-k4 .cm-small{grid-template-columns:repeat(2,minmax(0,1fr))}
.cm-top .big{min-height:434px}
.cm-row{display:flex;gap:14px}.cm-row .ctile{flex:1 1 0;min-width:0;height:230px}
@media (hover:hover){.ctile:hover img,.ctile:focus-visible img{transform:scale(1.07)}.ctile:hover .ctname em{transform:none;opacity:1}}
@media (hover:none){.ctile img{transition-duration:2.4s}.ctile.zin img{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.ctile img{transition:none;transform:none!important}}
@media (max-width:1050px){.cm-small{grid-template-rows:repeat(2,170px)}.cm-top .big{min-height:354px}.cm-row .ctile{height:190px}.ctname{font-size:14.5px;padding:34px 12px 12px}.ctile.big .ctname{font-size:19px}}
@media (max-width:700px){
 .catmosaic{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 .cm-top,.cm-small,.cm-row{display:contents}
 .catmosaic .ctile{height:auto;aspect-ratio:1;min-height:0}
 .catmosaic .ctile.big{grid-column:1/-1;aspect-ratio:16/10}
 .catmosaic .ctile.wide-m{grid-column:1/-1;aspect-ratio:16/8}
 .ctname{font-size:13.5px;padding:30px 10px 10px}.ctname em{width:24px;height:24px;font-size:13px}
 .ctile.big .ctname{font-size:19px;padding:44px 14px 14px}}
/* home: slim line above the category mosaic (the heading stays for screen readers and search engines) */
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.cathead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
.cathead .eyebrow{margin:0}
/* checkout: inactive payment placeholders */
.paystub{position:relative;opacity:.55;filter:grayscale(.25);user-select:none;pointer-events:none}
.paywallets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.paywallet{position:relative;height:46px;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:not-allowed;padding:0}
.paywallet.apple{background:#000;border-color:#000}
.paywallet svg{height:30px;width:auto}
.paysoon{position:absolute;top:-8px;right:8px;background:#fdf3dd;color:#8a5a0b;border:1px solid #f0d9a8;border-radius:999px;font-size:10.5px;font-weight:700;padding:1px 8px;letter-spacing:.02em}
.paycardwrap{position:relative}.paycardwrap>.paysoon{top:-9px;right:96px;z-index:1}
.payor{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin:14px 0 10px}.payor:before,.payor:after{content:"";flex:1;height:1px;background:var(--line)}
.paycard{border:0;padding:0;margin:0;display:grid;gap:8px;min-width:0}
.paycardrow{position:relative}.paycardrow .field{padding-right:92px}
.paycardbrands{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;gap:4px}.paycardbrands svg{width:32px;height:20px;border-radius:3px;box-shadow:0 0 0 1px var(--line)}
.paycardrow2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paycard .field:disabled{background:#f4f3ef;cursor:not-allowed}
.paynow{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--sage2);font-size:14px;line-height:1.45}
/* profile: password row with «Change password» */
.pwhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pwhead h2{margin:0 0 2px}.pwdots{letter-spacing:2px}
.pwpanel form{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
/* product card: large hover preview */
.cprev{position:fixed;z-index:65;width:420px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 22px 50px rgba(36,49,36,.22);padding:12px;display:none;opacity:0;transform:scale(.97);transition:opacity .18s,transform .18s}
.cprev.on{display:block;opacity:1;transform:none;animation:cpin .18s ease-out}
@keyframes cpin{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.cpimg{display:block;border-radius:12px;overflow:hidden;background:#efece4;aspect-ratio:1}
.cpmain{width:100%;height:100%;object-fit:cover;display:block}
.cpthumbs{display:flex;gap:6px;margin-top:8px}
.cpthumb{width:54px;height:54px;border-radius:9px;object-fit:cover;background:#efece4;border:2px solid transparent;cursor:pointer;opacity:.75;transition:.15s}
.cpthumb.on,.cpthumb:hover{border-color:var(--forest);opacity:1}
.cpinfo{display:flex;flex-direction:column;gap:2px;padding:10px 4px 2px;font-size:14px}
.cpinfo b{font-size:15px;line-height:1.3}
.cpinfo .price{font-weight:800}
@media (prefers-reduced-motion:reduce){.cprev,.cprev.on{animation:none;transition:none}}
.fav-inline.on svg{fill:var(--terra);stroke:var(--terra)}

<script id="store-data" type="application/json">{"version": 2, "settings": {"name": "CozyHouseVibe", "tagline": "Cozy things for your home", "currency": "$", "currencyPos": "before", "lang": "en", "promo": "Ships within 1\u20132 business days \u00b7 14-day returns", "shipStandard": 12, "shipExpress": 25, "expressOn": false, "taxRates": {"AK": 0, "AL": 9.46, "AR": 9.48, "AZ": 8.54, "CA": 9.03, "CO": 7.89, "CT": 6.35, "DC": 6, "DE": 0, "FL": 7, "GA": 7.56, "HI": 4.5, "IA": 6.94, "ID": 6.03, "IL": 8.98, "IN": 7, "KS": 8.71, "KY": 6, "LA": 10.13, "MA": 6.25, "MD": 6, "ME": 5.5, "MI": 6, "MN": 8.14, "MO": 8.44, "MS": 7.06, "MT": 0, "NC": 7.1, "ND": 7.09, "NE": 6.98, "NH": 0, "NJ": 6.625, "NM": 7.68, "NV": 8.24, "NY": 8.54, "OH": 7.29, "OK": 9.06, "OR": 0, "PA": 6.34, "RI": 7, "SC": 7.49, "SD": 6.11, "TN": 9.61, "TX": 8.2, "UT": 7.42, "VA": 5.77, "VT": 6.43, "WA": 9.57, "WI": 5.72, "WV": 6.6, "WY": 5.39}, "taxShipping": false, "returnDays": 14, "heroEyebrow": "New season \u00b7 New collection", "heroTitle": "Comfort you can feel", "heroText": "Ceramics, textiles and lighting for a home you love coming back to. Thoughtfully chosen pieces in warm, natural tones.", "phone": "", "email": "cozyhousevibe3@gmail.com", "telegram": "", "viber": "", "instagram": "", "hours": "Mon\u2013Fri 9am\u20136pm", "deliveryOptions": "Standard shipping (3\u20135 business days)\nExpress shipping (1\u20132 business days)", "paymentOptions": "Card \u2014 we\u2019ll email you a secure payment link", "deliveryText": "We pack and ship every order within 1\u20132 business days after confirmation.\n\nStandard shipping \u2014 3\u20135 business days, $12.\nExpress shipping (1\u20132 business days) is offered at checkout when available.\n\nSales tax is added at checkout based on your shipping address, in the states where we're required to collect it.\n\nPayment: by card via a secure payment link. After payment, your invoice is available in your account under My orders.\n\nReturns: within 14 days of delivery \u2014 see our Return policy.", "aboutText": "CozyHouseVibe is a small shop for a cozy, lived-in home.\n\nWe hand-pick ceramics, textiles, lighting and accessories that make a space feel warmer, and work with independent makers and trusted small producers.", "formEndpoint": "", "privacyText": "Last updated: November 25, 2026\n\nThis Privacy Policy explains how {store} (\"we\", \"us\") collects, uses and protects your personal information when you visit {site} or buy from us. {store} is operated by [Business legal name], {address}.\n\n## Information we collect\n- **Contact details** you give us: name, email, phone number and shipping address when you place an order, create an account, send us a message or chat with us.\n- **Chat messages** you send through the chat on our site.\n- **Order details:** the products you buy, order totals and delivery information.\n- **Account details:** your email and a password (stored securely and never visible to us), plus any saved address.\n- **Reviews** you choose to publish, shown with the name you enter.\n- **Basic technical data** your browser sends automatically (such as device and browser type).\n\nYour cart and recent searches are saved only in your own browser (your wishlist is also saved in your account if you have one).\n\n## How we use your information\n- To process, ship and deliver your orders and handle returns.\n- To reply to your questions (by chat or email) and send messages about your order.\n- To run your account and keep the store secure.\n- To meet our legal, tax and accounting obligations.\n\nWe do not sell or rent your personal information, and we do not share it for cross-context behavioral advertising.\n\n## Who we share it with\nOnly with service providers that help us run the store, and only as needed: our hosting and database provider, our payment provider (we never see or store your full card number), and shipping carriers (name, address and phone for delivery). We may also disclose information if the law requires it.\n\n## Cookies and similar technology\nWe use your browser's local storage for essential features such as your cart and sign-in.\n\nWe also keep **anonymous visit statistics** to understand how the store is used: which pages and products are viewed, what is added to the cart, what is searched for on our site, which website or link brought you here (for example Instagram or Google) and your device type (phone, tablet or computer). This uses a random visit number stored in your browser \u2014 no cookies, no name, email or IP address, and it is never used for advertising or shared with anyone. Visit statistics are kept for up to 2 years.\n\nWe don't use advertising cookies. If we add advertising tools, we will update this policy and ask for your consent where required.\n\n## How long we keep it\nWe keep order records for as long as needed for tax and accounting purposes (usually up to 7 years). You can ask us to delete your account at any time.\n\n## Your rights\nYou can ask us to access, correct or delete your personal information, or to stop sending you marketing messages. California residents have additional rights under the CCPA/CPRA, including the right to know what we collect and the right not to be discriminated against for using these rights. To make a request, email us at {email}. We will respond within 45 days.\n\n## Children\nOur store is not directed to children under 13, and we do not knowingly collect their information.\n\n## Changes\nWe may update this policy from time to time. The date at the top shows the latest version.\n\n## Contact\nQuestions about privacy? Email {email}.", "termsText": "Last updated: November 24, 2026\n\nThese Terms of Service apply to your use of {store} at {site} and to any purchase you make from us. {store} is operated by [Business legal name], {address}. By using the site or placing an order, you agree to these terms.\n\n## Products and pricing\nWe try to describe and photograph every product accurately. Colors may look slightly different on your screen, and handmade items can vary a little from piece to piece. Prices are shown in U.S. dollars and may change at any time. If a product is listed at an incorrect price, we may cancel the order and refund you in full.\n\n## Orders\nYour order is an offer to buy. We accept it when we confirm it or ship it. We may refuse or cancel an order \u2014 for example, if an item is out of stock, the price was wrong, or we suspect fraud. If we cancel after you've paid, you'll get a full refund.\n\n## Payment\nPayment is due when you place your order unless we agree otherwise. Applicable sales tax may be added at checkout.\n\n## Shipping\nWe ship within the United States. Delivery times are estimates and are not guaranteed. Risk of loss passes to you when the package is delivered to the carrier-confirmed address. See Shipping & payment for details.\n\n## Returns\nReturns and refunds are covered by our Returns & Refunds policy.\n\n## Your account\nKeep your password safe. You are responsible for activity on your account. Let us know right away at {email} if you think someone else has used it.\n\n## Reviews and content\nIf you post a review, you confirm it reflects your genuine experience, and you give us permission to display it on our site. We may remove content that is false, offensive or unrelated to the product.\n\n## Intellectual property\nThe site's text, photos, logo and design belong to {store} or its licensors and may not be copied without permission.\n\n## Limitation of liability\nTo the fullest extent permitted by law, our total liability for any claim related to a purchase is limited to the amount you paid for that order. We are not liable for indirect or consequential damages. Nothing in these terms limits rights you have under consumer protection law.\n\n## Governing law\nThese terms are governed by the laws of the State of [State], USA.\n\n## Changes\nWe may update these terms. The version posted when you place an order applies to that order.\n\n## Contact\n{email}", "returnsText": "Last updated: November 25, 2026\n\nWe want you to love what you ordered. If something isn't right, here's how returns work.\n\n## 14-day returns\nYou can return items within **14 days of delivery**. Returns open once your order is delivered \u2014 start yours in your account: **My orders \u2192 Return items**. If you checked out as a guest, email us at {email} with your order number (it starts with CHV-).\n\n## Cancel before it ships\nChanged your mind before your order ships? Cancel it yourself in **My orders \u2192 Cancel order** (or on the **Track your order** page with your order number and email). If you've already paid, we'll refund you in full within 5 business days. Once an order has shipped it can't be cancelled \u2014 you can return it after delivery.\n\n## Reasons for return\n- Found a better price\n- Item arrived in poor condition\n- Defective item\n- Doesn't look as expected\n\n## Return conditions\n- Add **photos or a video** of the item and its packaging to your request. For a defect or damage, please show it clearly.\n- Items must be unused and keep their original condition and appearance, in the **original packaging** with all tags, parts and accessories.\n- Please report items damaged in transit within 48 hours of delivery.\n\n## Who pays for return shipping\n- **Defective item or item arrived in poor condition** \u2014 the return is **free**. We'll email you a prepaid return label and refund the item price plus the original shipping.\n- **Found a better price or doesn't look as expected** \u2014 return shipping is **paid by you**, and original shipping charges aren't refundable.\n\n## Items we can't accept\n- Candles that have been burned\n- Items that show signs of use, or damage that happened after delivery\n- Final-sale items (marked as such on the product page)\n\n## How it works\n- Send your request from **My orders** with the items, the reason and photos or a video.\n- We'll review privacyText:"Last updated: November 25, 2026\n\nThis Privacy Policy explains how {store} (\"we\", \"us\") collects, uses and protects your personal information when you visit {site} or buy from us. {store} is operated by [Business legal name], {address}.\n\n## Information we collect\n- **Contact details** you give us: name, email, phone number and shipping address when you place an order, create an account, send us a message or chat with us.\n- **Chat messages** you send through the chat on our site.\n- **Order details:** the products you buy, order totals and delivery information.\n- **Account details:** your email and a password (stored securely and never visible to us), plus any saved address.\n- **Reviews** you choose to publish, shown with the name you enter.\n- **Basic technical data** your browser sends automatically (such as device and browser type).\n\nYour cart and recent searches are saved only in your own browser (your wishlist is also saved in your account if you have one).\n\n## How we use your information\n- To process, ship and deliver your orders and handle returns.\n- To reply to your questions (by chat or email) and send messages about your order.\n- To run your account and keep the store secure.\n- To meet our legal, tax and accounting obligations.\n\nWe do not sell or rent your personal information, and we do not share it for cross-context behavioral advertising.\n\n## Who we share it with\nOnly with service providers that help us run the store, and only as needed: our hosting and database provider, our payment provider (we never see or store your full card number), and shipping carriers (name, address and phone for delivery). We may also disclose information if the law requires it.\n\n## Cookies and similar technology\nWe use your browser's local storage for essential features such as your cart and sign-in.\n\nWe also keep **anonymous visit statistics** to understand how the store is used: which pages and products are viewed, what is added to the cart, what is searched for on our site, which website or link brought you here (for example Instagram or Google) and your device type (phone, tablet or computer). This uses a random visit number stored in your browser — no cookies, no name, email or IP address, and it is never used for advertising or shared with anyone. Visit statistics are kept for up to 2 years.\n\nWe don't use advertising cookies. If we add advertising tools, we will update this policy and ask for your consent where required.\n\n## How long we keep it\nWe keep order records for as long as needed for tax and accounting purposes (usually up to 7 years). You can ask us to delete your account at any time.\n\n## Your rights\nYou can ask us to access, correct or delete your personal information, or to stop sending you marketing messages. California residents have additional rights under the CCPA/CPRA, including the right to know what we collect and the right not to be discriminated against for using these rights. To make a request, email us at {email}. We will respond within 45 days.\n\n## Children\nOur store is not directed to children under 13, and we do not knowingly collect their information.\n\n## Changes\nWe may update this policy from time to time. The date at the top shows the latest version.\n\n## Contact\nQuestions about privacy? Email {email}.",
termsText:"Last updated: November 24, 2026\n\nThese Terms of Service apply to your use of {store} at {site} and to any purchase you make from us. {store} is operated by [Business legal name], {address}. By using the site or placing an order, you agree to these terms.\n\n## Products and pricing\nWe try to describe and photograph every product accurately. Colors may look slightly different on your screen, and handmade items can vary a little from piece to piece. Prices are shown in U.S. dollars and may change at any time. If a product is listed at an incorrect price, we may cancel the order and refund you in full.\n\n## Orders\nYour order is an offer to buy. We accept it when we confirm it or ship it. We may refuse or cancel an order — for example, if an item is out of stock, the price was wrong, or we suspect fraud. If we cancel after you've paid, you'll get a full refund.\n\n## Payment\nPayment is due when you place your order unless we agree otherwise. Applicable sales tax may be added at checkout.\n\n## Shipping\nWe ship within the United States. Delivery times are estimates and are not guaranteed. Risk of loss passes to you when the package is delivered to the carrier-confirmed address. See Shipping & payment for details.\n\n## Returns\nReturns and refunds are covered by our Returns & Refunds policy.\n\n## Your account\nKeep your password safe. You are responsible for activity on your account. Let us know right away at {email} if you think someone else has used it.\n\n## Reviews and content\nIf you post a review, you confirm it reflects your genuine experience, and you give us permission to display it on our site. We may remove content that is false, offensive or unrelated to the product.\n\n## Intellectual property\nThe site's text, photos, logo and design belong to {store} or its licensors and may not be copied without permission.\n\n## Limitation of liability\nTo the fullest extent permitted by law, our total liability for any claim related to a purchase is limited to the amount you paid for that order. We are not liable for indirect or consequential damages. Nothing in these terms limits rights you have under consumer protection law.\n\n## Governing law\nThese terms are governed by the laws of the State of [State], USA.\n\n## Changes\nWe may update these terms. The version posted when you place an order applies to that order.\n\n## Contact\n{email}",
returnsText:"Last updated: November 25, 2026\n\nWe want you to love what you ordered. If something isn't right, here's how returns work.\n\n## 14-day returns\nYou can return items within **14 days of delivery**. Returns open once your order is delivered — start yours in your account: **My orders → Return items**. If you checked out as a guest, email us at {email} with your order number (it starts with CHV-).\n\n## Cancel before it ships\nChanged your mind before your order ships? Cancel it yourself in **My orders → Cancel order** (or on the **Track your order** page with your order number and email). If you've already paid, we'll refund you in full within 5 business days. Once an order has shipped it can't be cancelled — you can return it after delivery.\n\n## Reasons for return\n- Found a better price\n- Item arrived in poor condition\n- Defective item\n- Doesn't look as expected\n\n## Return conditions\n- Add **photos or a video** of the item and its packaging to your request. For a defect or damage, please show it clearly.\n- Items must be unused and keep their original condition and appearance, in the **original packaging** with all tags, parts and accessories.\n- Please report items damaged in transit within 48 hours of delivery.\n\n## Who pays for return shipping\n- **Defective item or item arrived in poor condition** — the return is **free**. We'll email you a prepaid return label and refund the item price plus the original shipping.\n- **Found a better price or doesn't look as expected** — return shipping is **paid by you**, and original shipping charges aren't refundable.\n\n## Items we can't accept\n- Candles that have been burned\n- Items that show signs of use, or damage that happened after delivery\n- Final-sale items (marked as such on the product page)\n\n## How it works\n- Send your request from **My orders** with the items, the reason and photos or a video.\n- We'll review it and reply by email within 1–2 business days with instructions.\n- Pack the items in their original packaging and ship them back. Please keep your tracking number.\n- Once we receive and check your return, we'll refund the item price and the sales tax paid on it to your original payment method within 5 business days. Your bank may take a few more days to show it.\n\n## Exchanges\nThe quickest way to get a different color or size is to return the item and place a new order.\n\n## Questions\nEmail {email} — we're happy to help.",

/* ===== Anonymous visit statistics → public.track() → Seller Central «Аналітика» =====
   No cookies and no personal data: a random visit id (localStorage, new after 30 min idle), the page path,
   product ids, home-page block names, search words, traffic source (utm/referrer) and device type.
   Skipped for the shop owner (set when signing in to Seller Central), with ?notrack=1, and for automated browsers. */
const Trk={q:[],timer:null,lastPath:null,once:new Set(),
 off(){try{return LS.get("noTrack",false)||/[?&]notrack=1/.test(location.search+location.hash)||navigator.webdriver===true}catch(e){return true}},
 rid(){const a=new Uint8Array(8);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,"0")).join("")},
 source(){const u=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.split("?")[1]||""),g=k=>(u.get(k)||h.get(k)||"").trim();
  let source=g("utm_source").toLowerCase(),medium=g("utm_medium").toLowerCase(),campaign=g("utm_campaign");
  if(!source&&g("gclid")){source="google";medium=medium||"cpc"}
  if(!source&&g("fbclid"))source="facebook";
  if(!source){let host="";try{host=document.referrer?new URL(document.referrer).hostname.replace(/^(www|m|l|lm)\./,""):""}catch(e){}
   if(host&&host!==location.hostname&&!/stripe\.com$/.test(host)){
    const M=[["google","google"],["bing","bing"],["duckduckgo","duckduckgo"],["yahoo","yahoo"],["instagram","instagram"],["facebook","facebook"],["fb.","facebook"],["pinterest","pinterest"],["pin.it","pinterest"],["tiktok","tiktok"],["youtube","youtube"],["t.co","twitter"],["twitter","twitter"],["x.com","twitter"],["t.me","telegram"],["telegram","telegram"],["etsy","etsy"],["chatgpt","chatgpt"],["openai","chatgpt"]];
    const m=M.find(([k])=>host.includes(k));source=m?m[1]:host;
    medium=medium||(/^(google|bing|duckduckgo|yahoo)$/.test(source)?"organic":/^(instagram|facebook|pinterest|tiktok|youtube|twitter|telegram)$/.test(source)?"social":"referral")}}
  return{source:source||"direct",medium,campaign}},
 device(){const ua=navigator.userAgent||"",w=Math.min(screen.width||innerWidth,innerWidth);
  return /iPad|Tablet/i.test(ua)||(navigator.maxTouchPoints>1&&/Macintosh/.test(ua))?"tablet":/Mobi|Android|iPhone/i.test(ua)||w<700?"mobile":"desktop"},
 visit(path){const now=Date.now(),s=this.source();let v=LS.get("visit",null);
  const fresh=!v||!v.id||now-v.last>30*60000||(s.campaign&&s.campaign!==v.c);
  if(fresh){v={id:this.rid(),c:s.campaign||""};this.once.clear();this.q.push({visit:v.id,type:"visit",path,source:s.source,medium:s.medium||null,campaign:s.campaign||null,device:this.device()})}
  v.last=now;LS.set("visit",v);return v.id},
 path(){const p=(location.hash.slice(1)||"/").split("?")[0].split("/").filter(Boolean);
  return "/"+(p[0]==="product"||p[0]==="account"&&p[1]!=="invoice"?p.slice(0,2):p.slice(0,1)).join("/")},
 ev(type,o={}){if(this.off())return;try{const id=this.visit(this.path());this.q.push({visit:id,type,...o});clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),1500)}catch(e){}},
 one(key,type,o){if(this.once.has(key))return;this.once.add(key);this.ev(type,o)},
 flush(){clearTimeout(this.timer);while(this.q.length){const events=this.q.splice(0,30);
  try{fetch(SB_URL+"/rest/v1/rpc/track",{method:"POST",keepalive:true,headers:{"Content-Type":"application/json",apikey:SB_KEY},body:JSON.stringify({events})}).catch(()=>{})}catch(e){}}},
 /* called by the router after every render */
 page(parts){const path=this.path();if(path===this.lastPath)return;this.lastPath=path;
  this.ev("page",{path});
  if(parts[0]==="product"&&parts[1])this.ev("product",{product_id:String(parts[1]).slice(0,80),path});
  if(parts[0]==="checkout")this.ev("checkout",{path})},
 product(id){this.ev("product",{product_id:String(id).slice(0,80),path:this.path()})},
 cart(id,qty){this.ev("cart",{product_id:String(id).slice(0,80),value:Math.max(1,+qty||1)})},
 search(q,n){const s=String(q||"").trim().toLowerCase().slice(0,120);if(s)this.one("s:"+s,"search",{label:s,value:+n||0})},
 purchase(no,total){if(!no)return;this.one("o:"+no,"purchase",{label:String(no).slice(0,120),value:total==null?null:Math.round(+total*100)/100});this.flush()}};
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a,button");const b=a&&a.closest("[data-track]");if(b)Trk.ev("click",{label:b.dataset.track})},true);
document.addEventListener("visibilitychange",()=>{if(document.hidden)Trk.flush()});
addEventListener("pagehide",()=>Trk.flush());

/* ===== Customer sign-in & registration (Supabase Auth) — storefront only =====
   Session state, header account menu, Sign in / Create account / Forgot / Reset password screens,
   Sign in with Google / Facebook. Profile is in account.js; orders, invoices and returns in orders.js. */
let user=null,profile=null,authReady=false;
function sbInit(){
 try{if(!window.supabase||!window.supabase.createClient)return;
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{flowType:"pkce",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev,session)=>{const was=user&&user.id;user=session?session.user:null;if(!user)profile=null;
   setTimeout(()=>{acctBadge();if(user&&(was||null)!==user.id){syncFavs();claimGuest()}
    if(ev==="PASSWORD_RECOVERY"){location.hash="#/account/reset";return}
    if((was||null)!==(user&&user.id||null)&&/^#\/(account|checkout|orders)/.test(location.hash))render()},0)});
  sb.auth.getSession().then(({data})=>{user=data.session?data.session.user:null;authReady=true;acctBadge();if(user){syncFavs();claimGuest()}
   if(/[?&]code=|[?&]error/.test(location.search)){const next=(location.hash&&location.hash!=="#/"?location.hash:"")||LS.get("afterLogin","")||"#/account";LS.set("afterLogin","");history.replaceState(null,"",location.pathname+next);if(user)setTimeout(()=>{toast("Signed in");if(location.hash!==next)location.hash=next;else render()},0)}
   if(/^#\/(account|checkout|orders)/.test(location.hash))render()});
 }catch(e){sb=null}}

 const l=$("#acctLbl");if(l)l.innerHTML=`<small>${user?`Hi${nm?", "+esc(nm):""}`:"Hello, sign in"}</small><b>Account <i class="chev"></i></b>`;

async function authSubmit(k,f){
 const fd=Object.fromEntries(new FormData(f)),btn=f.querySelector("button.primary");const busy=b=>{btn.disabled=b};
 const email=String(fd.email||"").trim().toLowerCase();
 try{
 if(k==="acLogin"){if(!email||!fd.password)return acMsg("Enter your email and password.");busy(true);
  const{error}=await sb.auth.signInWithPassword({email,password:fd.password});busy(false);if(error)return acMsg(esc(authErr(error)));
  toast("Signed in");location.hash=LS.get("afterLogin","")||"#/account";LS.set("afterLogin","");return}
 if(k==="acRegister"){const name=String(fd.full_name||"").trim();
  if(!name||!/^\S+@\S+\.\S+$/.test(email))return acMsg("Enter your name and a valid email.");if(String(fd.password).length<8)return acMsg("Password must be at least 8 characters.");
  busy(true);const{data,error}=await sb.auth.signUp({email,password:fd.password,options:{data:{full_name:name},emailRedirectTo:SITE_URL}});busy(false);
  if(error)return acMsg(esc(authErr(error)));
  if(data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length)return acMsg("An account with this email already exists. <a class='textlink' href='#/account'>Sign in</a>");
  if(!data.session){f.innerHTML=`<div class="okbox">Almost done! We sent a confirmation link to <b>${esc(email)}</b>. Open it to activate your account.</div>`;return}
  toast("Account created");location.hash=LS.get("afterLogin","")||"#/account";LS.set("afterLogin","");return}
 if(k==="acForgot"){if(!/^\S+@\S+\.\S+$/.test(email))return acMsg("Enter a valid email.");busy(true);
  const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:SITE_URL});busy(false);if(error)return acMsg(esc(authErr(error)));
  f.innerHTML=`<div class="okbox">If an account exists for <b>${esc(email)}</b>, a reset link is on its way.</div>`;return}
 if(k==="acReset"){if(String(fd.password).length<8)return acMsg("Password must be at least 8 characters.");busy(true);
  const{error}=await sb.auth.updateUser({password:fd.password});busy(false);if(error)return acMsg(esc(authErr(error)));toast("Password updated");location.hash="#/account";return}
 }catch(e){busy(false);acMsg(esc(authErr(e)))}}

  const row={order_no:o.no,customer,items:o.lines.map(l=>({id:l.id,name:l.name,sku:l.sku||null,price:l.price,qty:l.qty,...(l.opt?{opt:l.opt}:{})})),total:o.total,currency:"USD",user_id:user?user.id:null};

  r=m.match(/OPTION_REQUIRED:(.+):[^:]+$/);if(r)return{ok:false,stock:true,msg:`The options for “${r[1]}” have changed. Please remove it from your cart and add it again.`};

  console.warn("order save failed",m);return{ok:false}}

/* ===== Buy again: adds the order's items that are still available and in stock ===== */
function buyAgain(id,ix){const o=MY_ORDERS[id];if(!o)return;let added=0;const miss=[];
 (o.items||[]).filter((_,k)=>ix==null||k===ix).forEach(i=>{const p=prod(i.id),nm=i.name||"An item";
  if(!p||!p.active)return miss.push(nm+" (no longer available)");
  if(p.stock<=0)return miss.push(nm+" (out of stock)");
  let opt=null;if(optList(p).length){opt=i.opt&&typeof i.opt==="object"?i.opt:null;if(!opt||!optOk({opt},p))return miss.push(nm+" (options changed — please choose again)")}
  const line={id:p.id,qty:0,...(opt?{opt}:{})},k=lkey(line);let l=lineByKey(k);if(!l){l=line;cart.push(l)}
  const can=Math.min(+i.qty||1,lineMax(l));if(can<=0){if(!l.qty)cart=cart.filter(x=>x!==l);return miss.push(nm+" (no more in stock)")}
  l.qty+=can;added+=can;if(can<(+i.qty||1))miss.push(`${nm} (only ${can} added)`)});
 setCart(cart);
 if(!added){toast(miss.length?"These items aren’t available right now":"Nothing to add");return}
 openCart();const d=$("#cartDrawer .dbody");if(d&&miss.length)d.insertAdjacentHTML("afterbegin",`<div class="note small" style="margin-bottom:10px">Added ${added} item${added===1?"":"s"} from order ${esc(o.order_no)}. Not added: ${miss.map(esc).join("; ")}.</div>`);
 toast(`Added ${added} item${added===1?"":"s"} to your cart`)}

/* ===== live chat widget (storefront) =====
   The visitor gets a secret random key (kept in this browser). Messages go through the database
   functions chat_send / chat_fetch, so nobody can read another visitor's conversation. */
const Chat={key:null,msgs:[],last:0,seen:0,isOpen:false,timer:null,busy:false,
 icon:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h7M8.5 14h4.5"/></svg>',
 init(){
  if(!sb||$("#chatBtn"))return;
  this.key=LS.get("chatKey",null);this.msgs=LS.get("chatMsgs",[]);this.last=this.msgs.reduce((m,x)=>Math.max(m,x.id||0),0);this.seen=LS.get("chatSeen",0);
  const b=document.createElement("button");b.id="chatBtn";b.className="chatbtn";b.type="button";b.setAttribute("aria-label","Chat with us");b.setAttribute("aria-expanded","false");b.setAttribute("aria-controls","chatPanel");
  b.innerHTML=this.icon+'<span class="chatlbl">Chat with us</span><span class="chatdot" id="chatDot" hidden></span>';b.addEventListener("click",()=>this.toggle());document.body.appendChild(b);
  const p=document.createElement("section");p.id="chatPanel";p.className="chatpanel";p.setAttribute("role","dialog");p.setAttribute("aria-label","Chat");p.hidden=true;document.body.appendChild(p);
  p.addEventListener("submit",e=>{e.preventDefault();e.stopPropagation();this.send(e.target)});
  p.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&e.target.name==="body"&&!e.isComposing){e.preventDefault();e.target.form.requestSubmit()}if(e.key==="Escape")this.toggle(false)});
  p.addEventListener("click",e=>{if(e.target.closest("[data-chatclose]"))this.toggle(false)});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&this.key)this.poll()});
  this.badge();if(this.key)this.poll()},
 toggle(v){this.isOpen=v===undefined?!this.isOpen:v;const p=$("#chatPanel"),b=$("#chatBtn");p.hidden=!this.isOpen;b.classList.toggle("on",this.isOpen);b.setAttribute("aria-expanded",String(this.isOpen));
  if(this.isOpen){this.render();this.markSeen();if(this.key)this.poll();setTimeout(()=>{const t=p.querySelector("textarea, input");t&&t.focus({preventScroll:true})},50)}else{b.focus({preventScroll:true});this.schedule()}},
 schedule(){clearTimeout(this.timer);if(!this.key)return;this.timer=setTimeout(()=>this.poll(),document.hidden?120000:this.isOpen?4000:40000)},
 async poll(){clearTimeout(this.timer);if(!this.key||!sb)return;
  try{const{data,error}=await sb.rpc("chat_fetch",{p_key:this.key,p_after:this.last});
   if(!error&&data){const n=(data.messages||[]).filter(m=>!this.msgs.some(x=>x.id===m.id));
    if(data.status==="none"&&!n.length&&this.msgs.length){/* conversation was deleted by the shop */this.key=null;this.msgs=[];this.last=0;LS.set("chatKey",null);LS.set("chatMsgs",[]);if(this.isOpen)this.render();this.badge();return}
    if(n.length){this.msgs=this.msgs.concat(n).slice(-150);this.last=this.msgs.reduce((m,x)=>Math.max(m,x.id||0),0);LS.set("chatMsgs",this.msgs);if(this.isOpen){this.drawList();this.markSeen()}this.badge()}}}catch(e){}
  this.schedule()},
 markSeen(){const s=this.msgs.filter(m=>m.sender==="seller").reduce((m,x)=>Math.max(m,x.id),0);if(s>this.seen){this.seen=s;LS.set("chatSeen",s)}this.badge()},
 badge(){const n=this.msgs.filter(m=>m.sender==="seller"&&m.id>this.seen).length,d=$("#chatDot");if(d){d.hidden=!n||this.isOpen;d.textContent=n||""}},
 time(at){const d=new Date(at);return isNaN(d)?"":d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})},
 bubbles(){return this.msgs.map(m=>`<div class="cmsg ${m.sender==="seller"?"them":"me"}"><div class="cb">${esc(m.body)}</div><small>${m.sender==="seller"?esc(S.settings.name)+" · ":""}${this.time(m.at)}</small></div>`).join("")},
 drawList(){const L=$("#chatList");if(!L)return;L.innerHTML=this.welcome()+this.bubbles()+(this.msgs.length&&!this.msgs.some(m=>m.sender==="seller")?`<p class="cnote">Thanks! We’ll reply right here${this.email()?" — and by email if you’ve left the site":""}.</p>`:"");L.scrollTop=L.scrollHeight},
 email(){return LS.get("chatEmail","")},

  const nm=LS.get("chatName","")||(typeof profile!=="undefined"&&profile&&profile.full_name)||"",em=this.email()||(typeof user!=="undefined"&&user&&user.email)||"";
  p.innerHTML=`<header class="chead">${logo?`<img src="${esc(logo)}" alt="">`:""}<div><b>${esc(st.name)}</b><small>${st.hours?"We reply "+esc(st.hours):"We usually reply within a few hours"}</small></div><button type="button" class="iconbtn" data-chatclose aria-label="Close chat">${X}</button></header>
  <div class="clist" id="chatList" aria-live="polite"></div>
  <form class="cform" novalidate>${first?`<div class="cfields"><input class="field" name="name" maxlength="80" placeholder="Your name" autocomplete="name" value="${esc(nm)}"><input class="field" name="email" type="email" maxlength="200" placeholder="Email (so we can reply if you leave)" autocomplete="email" value="${esc(em)}"></div>`:""}
  <div class="crow"><textarea class="field" name="body" rows="1" maxlength="2000" placeholder="Type your message…" aria-label="Message"></textarea><button class="btn primary" aria-label="Send">Send</button></div><div class="cerr" id="chatErr"></div></form>`;
  this.drawList()},

  if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){err.textContent="Please check your email address.";return}
  if(!this.key){this.key=(crypto.randomUUID?crypto.randomUUID():"10000000-1000-4000-8000-100000000000".replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)));LS.set("chatKey",this.key)}
  this.busy=true;const btn=f.querySelector("button.primary");btn.disabled=true;
  const{error}=await sb.rpc("chat_send",{p_key:this.key,p_body:body,p_name:name||null,p_email:email||null,p_page:location.hash.slice(0,300)||"#/"});
  this.busy=false;btn.disabled=false;
  if(error){err.textContent=/TOO_MANY/.test(error.message)?"You’re sending messages too fast. Please wait a few minutes.":/BAD_EMAIL/.test(error.message)?"Please check your email address.":"Couldn’t send. Please try again or email "+(S.settings.email||"us")+".";return}
  if(name)LS.set("chatName",name);if(email)LS.set("chatEmail",email);
  const wasFirst=!this.msgs.length;await this.poll();if(wasFirst)this.render();else{f.body.value="";f.body.style.height=""}

};

let cart=LS.get("cart",[]),favs=LS.get("favs",[]);
/* options (variants): p.options=[{name:"Color",values:["Sage","Oat"]}], cart line {id,qty,opt:{Color:"Sage"}} */
function cartLines(){return cart.map(l=>({...l,k:lkey(l),p:prod(l.id)})).filter(l=>l.p&&l.p.active&&optOk(l,l.p))}
function lineMax(l){const p=prod(l.id);if(!p)return 0;const k=lkey(l);return Math.max(0,p.stock-cart.filter(x=>x.id===l.id&&lkey(x)!==k).reduce((s,x)=>s+x.qty,0))}
const lineByKey=k=>cart.find(x=>lkey(x)===k);
/* "Buy now": checkout of a single item without touching the cart */
let buyNow=LS.get("buynow",null);
const isBuyNow=()=>/[?&]buy=1/.test(location.hash)&&!!buyNow&&!!prod(buyNow.id);
function coLines(){return isBuyNow()?[{...buyNow,k:lkey(buyNow),p:prod(buyNow.id)}].filter(l=>l.p&&l.p.active&&optOk(l,l.p)):cartLines()}
const coTotal=()=>coLines().reduce((s,l)=>s+l.p.price*l.qty,0);
function startBuyNow(id,q,opt){const p=prod(id);if(!p||p.stock<=0)return;Trk.cart(id,q);buyNow={id,qty:Math.max(1,Math.min(p.stock,q||1)),...(opt?{opt}:{})};LS.set("buynow",buyNow);closeLayers(true);location.hash="#/checkout?buy=1"}
function cartTotal(){return cartLines().reduce((s,l)=>s+l.p.price*l.qty,0)}
function setCart(c){cart=c;LS.set("cart",cart);badges()}
function addToCart(id,q=1,opt=null){const p=prod(id);if(!p||p.stock<=0)return;
 if(optList(p).length&&!opt){closeLayers(true);location.hash="#/product/"+id;toast("Please choose "+optList(p).map(o=>o.name.toLowerCase()).join(" and "));return}
 Trk.cart(id,q);
 const nl={id,qty:0,...(opt?{opt}:{})},k=lkey(nl);let l=lineByKey(k);if(!l){l=nl;cart.push(l)}
 const max=lineMax(l);if(max<=l.qty){if(!l.qty)cart=cart.filter(x=>x!==l);toast(max?"You already have all "+max+" in your cart":"No more in stock");return}
 l.qty=Math.min(max,l.qty+q);setCart(cart);openCart()}
function optsHtml(p,scope){const L=optList(p);if(!L.length)return"";
 return `<div class="opts" data-scope="${scope}">${L.map((o,i)=>`<fieldset class="optset"><legend>${esc(o.name)}: <b class="optval"></b></legend><div class="optchips">${o.values.map(v=>`<label class="optchip"><input type="radio" name="${scope}-o${i}" value="${esc(v)}" data-oname="${esc(o.name)}" data-act="optpick"><span>${esc(v)}</span></label>`).join("")}</div></fieldset>`).join("")}</div>`}
function readOpts(p,scope){const L=optList(p);if(!L.length)return{ok:true,opt:null};const box=document.querySelector(`.opts[data-scope="${scope}"]`),opt={};
 for(const o of L){const c=box&&[...box.querySelectorAll("input:checked")].find(i=>i.dataset.oname===o.name);if(!c){if(box){box.classList.add("need");const fs=[...box.querySelectorAll(".optset")].find(f=>f.querySelector(`[data-oname="${CSS.escape(o.name)}"]`));fs&&fs.scrollIntoView({block:"center",behavior:"smooth"})}toast("Please choose "+o.name.toLowerCase());return{ok:false}}opt[o.name]=c.value}
 return{ok:true,opt}}

const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const tokens=q=>norm(q).split(/[^a-z0-9\u0400-\u04ff]+/).filter(Boolean);
const stem=w=>w.length>4&&/(ches|shes|xes|sses)$/.test(w)?w.slice(0,-2):w.length>3&&/[^s]s$/.test(w)?w.slice(0,-1):w;
function near(a,b){if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,e=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}if(++e>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}return e+(a.length-i)+(b.length-j)<=1}
function scoreOf(p,toks){
 const c=catOf(p.cat),name=norm(p.name),cat=norm(c?catLabel(c):""),rest=norm([p.short,p.desc,p.sku,...(p.specs||[]).flat()].join(" "));
 const nw=name.split(/[^a-z0-9\u0400-\u04ff]+/).filter(Boolean),aw=(cat+" "+rest).split(/[^a-z0-9\u0400-\u04ff]+/).filter(Boolean);
 let s=0;
 for(const t of toks){let b=0;
  const st=stem(t);
  if(nw.some(w=>w.startsWith(t)||stem(w)===st))b=10;else if(name.includes(t))b=7;else if(cat.includes(t))b=6;else if(aw.some(w=>w.startsWith(t)))b=4;
  else if(aw.some(w=>stem(w)===st))b=4;
  else if(t.length>=4&&nw.concat(cat.split(/[^a-z0-9\u0400-\u04ff]+/)).some(w=>w.length>=4&&((st.length>=4&&near(st,stem(w)))||near(t,w)||near(t,w.slice(0,t.length)))))b=2;
  if(!b)return 0;s+=b}
 if(name.startsWith(toks.join(" ")))s+=5;if(p.stock>0)s+=1;if(p.featured)s+=.5;return s}

/* ===== home: «Shop by category» mosaic. Lays out any number of categories without a lonely tile:
   5, 7, 9–11 → a big first tile + 4 or 6 small ones (+ one stretched row); otherwise rows (≤4 → one row, 6 → 3+3, else rows of 4);
   an incomplete last row stretches to full width. Phone: big tile full width, then 2 per row, odd last tile full width. ===== */
function catMosaic(L){const n=L.length;if(!n)return"";
 const tile=(c,cls)=>`<a class="ctile ${cls||""}" href="#/shop?cat=${c.id}"><img src="${esc(catImg(c))}" alt="" loading="lazy"><span class="ctname">${esc(c.name)}<em aria-hidden="true">→</em></span></a>`;
 const big=[5,7,9,10,11].includes(n),k=n===5?4:6;let html="",rest=L,idx=0;
 const oddLast=i=>{const small=big?n-1:n;return small%2===1&&i===n-1?"wide-m":""};
 if(big){html+=`<div class="cm-top cm-k${k}">${tile(L[0],"big")}<div class="cm-small">${L.slice(1,1+k).map((c,j)=>tile(c,oddLast(1+j))).join("")}</div></div>`;rest=L.slice(1+k);idx=1+k}
 /* balanced rows of up to 4: 6 → 3+3, 13 → 4+3+3+3 — never a row with a single tile */
 const m=rest.length,r=Math.ceil(m/4),sizes=Array.from({length:r},(_,i)=>Math.floor(m/r)+(i<m%r?1:0));let i=0;
 sizes.forEach(sz=>{html+=`<div class="cm-row">${rest.slice(i,i+sz).map((c,j)=>tile(c,oddLast(idx+i+j))).join("")}</div>`;i+=sz});
 return `<div class="catmosaic">${html}</div>`}

function richText(txt){
 const blocks=fillTokens(txt).replace(/\r/g,"").split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
 const inline=x=>esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/([\w.+-]+@[\w-]+\.[\w.]+)/g,'<a class="textlink" href="mailto:$1">$1</a>');
 const one=b=>{if(!b)return"";if(b.startsWith("## ")){const i=b.indexOf("\n");return `<h2>${inline(i<0?b.slice(3):b.slice(3,i))}</h2>`+(i<0?"":one(b.slice(i+1).trim()))}const L=b.split("\n");if(L.every(l=>/^- /.test(l)))return `<ul>${L.map(l=>`<li>${inline(l.slice(2))}</li>`).join("")}</ul>`;return `<p>${L.map(inline).join("<br>")}</p>`};
 return blocks.map(one).join("")}
function viewLegal(k){const T={privacy:["Privacy Policy","privacyText"],terms:["Terms of Service","termsText"],returns:["Returns & Refunds","returnsText"]}[k];
 return `<div class="page-head"><div class="shell"><div class="crumbs"><a href="#/">${t("home")}</a> / ${esc(T[0])}</div><h1>${esc(T[0])}</h1></div></div><div class="shell section"><div class="legal">${richText(S.settings[T[1]])}</div><p class="small muted" style="margin-top:30px">Other policies: ${[["returns","Returns & refunds"],["privacy","Privacy policy"],["terms","Terms of service"],["delivery","Shipping & payment"]].filter(x=>x[0]!==k).map(([h,l])=>`<a class="textlink" href="#/${h}">${l}</a>`).join(" · ")}</p></div>`}
function viewAbout(){
 const s=S.settings,paras=String(s.aboutStory||s.aboutText||"").replace(/\r/g,"").split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
 const vals=String(s.aboutValues||"").split("\n").map(x=>x.split("|").map(y=>y.trim())).filter(x=>x.length>=2&&x[1]);
 const img=s.aboutImage||s.heroImage||PHOTO.hero;
 return `<section class="about-hero"><div class="shell about-grid"><div><span class="eyebrow">Our story</span><h1>${esc(s.aboutTitle||"About us")}</h1>${s.aboutIntro?`<p class="lead">${esc(s.aboutIntro)}</p>`:""}<div class="hero-cta"><a class="btn primary" href="#/shop">Shop the collection →</a><a class="btn" href="#/contacts">Say hello</a></div></div><div class="about-img"><img src="${esc(img)}" alt=""></div></div></section>
 ${paras.length?`<section class="section"><div class="shell about-story">${paras.map((p,i)=>i===0?`<p class="first">${esc(p)}</p>`:`<p>${esc(p)}</p>`).join("")}</div></section>`:""}
 ${vals.length?`<section class="section alt"><div class="shell"><div class="section-head"><div><span class="eyebrow">What we care about</span><h2>Our promise to you</h2></div></div><div class="values">${vals.map(([i,ti,tx])=>`<div class="value"><i aria-hidden="true">${esc(i)}</i><b>${esc(ti||"")}</b><p>${esc(tx||"")}</p></div>`).join("")}</div></div></section>`:""}
 <section class="section"><div class="shell about-cta"><h2>${esc(s.aboutCta||"Make your home a little cozier")}</h2><p>Have a question about a product or an order? We read every message — <a class="textlink" href="#/contacts">get in touch</a>.</p><a class="btn primary" href="#/shop">Browse all products →</a></div></section>`}
/* ===== SEO tags (title, description, social preview, product data for Google) ===== */
function setMetaTag(attr,key,val){let m=document.head.querySelector(`meta[${attr}="${key}"]`);if(!m){m=document.createElement("meta");m.setAttribute(attr,key);document.head.appendChild(m)}m.setAttribute("content",val||"")}
function applySeo(parts,q){const st=S.settings,base=st.name||"CozyHouseVibe",clip=(x,n)=>{x=String(x||"").replace(/\s+/g," ").trim();return x.length>n?x.slice(0,n-1).trim()+"…":x};
 let title=st.seoTitle||base+(st.tagline?" — "+st.tagline:""),desc=st.seoDescription||st.heroText||"",img=st.heroImage||"",ld=null;const pg=parts[0]||"";
 if(pg==="product"){const p=prod(parts[1]);if(p&&p.active){title=p.seoTitle||p.name+" | "+base;desc=p.seoDesc||p.short||p.desc||"";img=img0(p);const r=rating(p.id);
  ld={"@context":"https://schema.org","@type":"Product",name:p.name,sku:p.sku||undefined,description:clip(p.desc||p.short,500),image:(p.images||[]).filter(u=>/^https?:/.test(u)).slice(0,5),brand:{"@type":"Brand",name:base},offers:{"@type":"Offer",priceCurrency:"USD",price:String(p.price),availability:"https://schema.org/"+(p.stock>0?"InStock":"OutOfStock"),url:location.href},...(r?{aggregateRating:{"@type":"AggregateRating",ratingValue:r.avg.toFixed(1),reviewCount:r.n}}:{})}}}
 else if(pg==="shop"){const c=catOf(q.get("cat"));title=(c?c.name:"All products")+" | "+base;desc=c?`Shop ${c.name.toLowerCase()} at ${base}: ${clip(desc,110)}`:desc}
 else if(pg){const T={about:"Our story",contacts:"Contact us",delivery:"Shipping & payment",returns:"Returns & refunds",privacy:"Privacy policy",terms:"Terms of service",track:"Track your order"};if(T[pg])title=T[pg]+" | "+base}
 document.title=clip(title,70);desc=clip(desc,160);setMetaTag("name","description",desc);setMetaTag("property","og:title",document.title);setMetaTag("property","og:description",desc);setMetaTag("property","og:type",pg==="product"?"product":"website");if(/^https?:/.test(img))setMetaTag("property","og:image",img);
 let s=document.getElementById("ldjson");if(ld){if(!s){s=document.createElement("script");s.type="application/ld+json";s.id="ldjson";document.head.appendChild(s)}s.textContent=JSON.stringify(ld).replace(/</g,"\\u003c")}else if(s)s.remove()}
function notFound(){return `<div class="shell section"><div class="empty"><b>404</b>${lang==="en"?"Page not found.":"Сторінку не знайдено."}<br><br><a class="btn" href="#/">${t("backHome")}</a></div></div>`}

/* ===== contact form ===== */
async function sendContact(f){
 const fd=Object.fromEntries(new FormData(f)),btn=f.querySelector("button.primary"),msg=$("#ctMsg");
 if(fd.website)return; // honeypot
 const name=String(fd.name||"").trim(),email=String(fd.email||"").trim(),body=String(fd.body||"").trim(),order_no=String(fd.order_no||"").trim()||null;
 if(!name||!/^\S+@\S+\.\S+$/.test(email)||body.length<2){msg.innerHTML=`<div class="note">Please enter your name, a valid email and a message.</div>`;return}
 if(!sb){msg.innerHTML=`<div class="note">Can’t send right now. Please email us instead.</div>`;return}
 btn.disabled=true;const{error}=await sb.from("messages").insert({name,email,body,order_no});btn.disabled=false;
 if(error){msg.innerHTML=`<div class="note">${/TOO_MANY/.test(error.message)?"You’ve sent several messages already. We’ll get back to you soon.":"Couldn’t send your message. Please try again or email us."}</div>`;return}
 LS.set("ctName",name);LS.set("ctEmail",email);
 f.innerHTML=`<div class="okbox">Thanks, ${esc(name.split(" ")[0])}! Your message was sent. We usually reply within one business day.</div>`}

/* ===== router ===== */
let lastPath="";
function render(){
 const h=location.hash.slice(1)||"/";const[path,qs]=h.split("?");const q=new URLSearchParams(qs||"");const parts=path.split("/").filter(Boolean);
 document.body.classList.toggle("invoice-mode",path.startsWith("/account/invoice"));markNav(path);hsClose();hsSync(path,q);let html;
 html=({"":()=>viewHome(),shop:()=>viewShop(q),product:()=>viewProduct(parts[1]),cart:viewCart,checkout:viewCheckout,order:()=>viewOrder(q),favorites:viewFavs,account:()=>viewAccount(parts),delivery:()=>viewText(t("delivery"),S.settings.deliveryText),about:viewAbout,contacts:viewContacts,track:()=>viewTrack(q),privacy:()=>viewLegal("privacy"),terms:()=>viewLegal("terms"),returns:()=>viewLegal("returns")}[parts[0]||""]||notFound)();
 if(html!==undefined&&html!=="")app.innerHTML=html;
 catZoom(); if(path!==lastPath)window.scrollTo(0,0);lastPath=path;if(parts[0]==="product"&&q.get("review")==="1")setTimeout(()=>{const r=$("#reviews");r&&r.scrollIntoView({behavior:"smooth"})},120);applySeo(parts,q);Trk.page(parts);
}

/* ===== events ===== */
document.addEventListener("click",e=>{
 if(e.target.id==="qv"){closeLayers();return}
 if((!e.target.closest("#acctWrap")||e.target.closest("#acctMenu a")))closeAcct();
 const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,id=el.dataset.id;
 const H={
  menu:()=>$("#nav").classList.toggle("open"),
  navexp:()=>{const it=el.closest(".navitem"),on=it.classList.toggle("open");el.setAttribute("aria-expanded",on)},
  lang:()=>{lang=lang==="en"?"uk":"en";LS.set("lang",lang);document.documentElement.lang=lang==="en"?"en":"uk";chrome();render()},
  fav:()=>{e.preventDefault();toggleFav(id)},add:()=>{e.preventDefault();addToCart(id)},
  addq:()=>{const r=readOpts(prod(id),"pdp");if(r.ok)addToCart(id,Math.max(1,parseInt($("#pq").value)||1),r.opt)},
  carmove:()=>{e.preventDefault();carMove(el.closest(".car"),+el.dataset.d)},
  cargo:()=>{e.preventDefault();const c=el.closest(".car")||document.querySelector(`.car[data-car="${el.dataset.car}"]`);carGo(c,+el.dataset.i)},
  lbopen:()=>{const c=el.closest(".car");lightbox([...c.querySelectorAll(".carslide img")].map(i=>i.getAttribute("src")),+el.dataset.i,c.dataset.alt||"")},
  lbclose:()=>closeLightbox(),
  buynow:()=>{const sc=el.dataset.scope,r=readOpts(prod(id),sc);if(!r.ok)return;const q=parseInt(($(sc==="qv"?"#qvq":"#pq")||{}).value)||1;startBuyNow(id,q,r.opt)},
  toreviews:()=>{const r=$("#reviews");r&&r.scrollIntoView({behavior:"smooth"})},
  revopen:()=>{const f=$('[data-form="review"]');if(f){f.hidden=false;el.hidden=true;const s=f.querySelector("input");s&&s.focus()}},
  revlogin:()=>{LS.set("afterLogin","#/product/"+id)},
  "q-":()=>{const i=$("#pq");i.value=Math.max(1,(+i.value||1)-1)},"q+":()=>{const i=$("#pq");i.value=Math.min(+i.max||99,(+i.value||1)+1)},
  rm:()=>{const k=el.dataset.k;setCart(cart.filter(l=>lkey(l)!==k));render()},
  cq:()=>{const l=lineByKey(el.dataset.k);if(!l)return;l.qty=Math.max(1,Math.min(lineMax(l),l.qty+ +el.dataset.d));setCart(cart);render()},
  hsclear:()=>{e.preventDefault();LS.set("recent",[]);hsClose();hsIn().focus()},
  cart:()=>{e.preventDefault();openCart()},
  acctmenu:()=>{e.preventDefault();const w=$("#acctWrap"),o=!w.classList.contains("open");w.classList.toggle("open",o);el.setAttribute("aria-expanded",String(o))},
  pwopen:()=>pwToggle(),
  pw:()=>{const i=el.parentNode.querySelector("input");i.type=i.type==="password"?"text":"password";el.textContent=i.type==="password"?"Show":"Hide"},
  signout:async()=>{await sb.auth.signOut();profile=null;favs=[];LS.set("favs",favs);badges();toast("Signed out");location.hash="#/account"},
  cologin:()=>{LS.set("afterLogin","#/checkout")},
  filters:()=>openLayer("filters"),
  more:()=>{shopShown+=12;render()},
  closeall:()=>{e.preventDefault();closeLayers()},
  qv:()=>{e.preventDefault();quickView(id)},
  qvq:()=>{const i=$("#qvq");i.value=Math.max(1,Math.min(+i.max||99,(+i.value||1)+ +el.dataset.d))},
  qvadd:()=>{const r=readOpts(prod(id),"qv");if(r.ok)addToCart(id,Math.max(1,parseInt($("#qvq").value)||1),r.opt)},
  mq:()=>{const l=lineByKey(el.dataset.k);if(!l)return;const mx=lineMax(l);l.qty+=+el.dataset.d;if(l.qty<1)cart=cart.filter(x=>x!==l);else l.qty=Math.min(mx,l.qty);setCart(cart);renderMini();if(/^#\/(cart|checkout)/.test(location.hash))render()},
  mrm:()=>{const k=el.dataset.k;setCart(cart.filter(l=>lkey(l)!==k));renderMini();if(/^#\/(cart|checkout)/.test(location.hash))render()},
  copyorder:()=>{copy($("#otext").value)},
  cancelopen:()=>{const f=document.querySelector(`[data-form="cancelord"][data-no="${el.dataset.no}"]`);if(f){f.hidden=!f.hidden;if(!f.hidden)f.querySelector("select").focus()}},
  retopen:()=>{const f=document.querySelector(`[data-form="retreq"][data-id="${id}"]`);if(f){f.hidden=!f.hidden;if(!f.hidden)f.querySelector("input").focus()}},
  invprint:()=>window.print(),
  perkchat:()=>{if(typeof Chat!=="undefined"&&$("#chatPanel"))Chat.toggle(true);else location.hash="#/contacts"},
  buyagain:()=>buyAgain(+id,el.dataset.ix==null?null:+el.dataset.ix),
  delacct:()=>{const f=$('[data-form="delacct"]');if(f){f.hidden=!f.hidden;if(!f.hidden)f.querySelector("input").focus()}},
  oauth:()=>oauthLogin(el.dataset.p),
  invpdf:()=>downloadInvoice(el),
  tg:()=>{copy($("#otext").value);window.open("https://t.me/"+el.dataset.u,"_blank")},
 };
 if(H[a])H[a]();
});
document.addEventListener("change",e=>{
 if(e.target.matches&&e.target.matches(".filepick input[type=file]")){const n=[...e.target.files].map(x=>x.name),s=e.target.parentNode.querySelector(".filenames");if(s)s.textContent=n.length?(n.length===1?n[0]:n.length+" files: "+n.join(", ")):"No files selected"}
 {const f=e.target.form;if(f&&f.dataset.form==="checkout"&&(e.target.name==="state"||e.target.name==="delivery")){const sm=$("#coSum");if(sm)sm.outerHTML=summary(false,f.state.value,/express/i.test((f.querySelector("[name=delivery]:checked")||{}).value||""))}}
 const el=e.target;
 if(el.dataset.act==="sortchange"){const f=el.form;go(f)}
 else if(el.dataset.act==="fsort"){const raw=new URLSearchParams(location.hash.split("?")[1]||"").get("q");setParams({sort:el.value===(raw?"rel":"pop")?"":el.value})}
 else if(el.dataset.act==="fstock"){closeLayers(true);setParams({stock:el.checked?"1":""})}
 else if(el.dataset.act==="cqi"){const l=lineByKey(el.dataset.k);if(!l)return;l.qty=Math.max(1,Math.min(lineMax(l),parseInt(el.value)||1));setCart(cart);render()}
 else if(el.dataset.act==="optpick"){const fs=el.closest(".optset");if(fs)fs.querySelector(".optval").textContent=el.value;const b=el.closest(".opts");b&&b.classList.remove("need")}
});
document.addEventListener("submit",e=>{const f=e.target;const k=f.dataset.form;if(!k)return;e.preventDefault();
 if(k==="shopsearch")go(f);else if(k==="price"){const mn=f.min.value.trim(),mx=f.max.value.trim();let lo=mn===""?"":Math.max(0,+mn),hi=mx===""?"":Math.max(0,+mx);if(lo!==""&&hi!==""&&lo>hi)[lo,hi]=[hi,lo];closeLayers(true);setParams({min:lo,max:hi})}else if(k==="checkout")placeOrder(f);else if(k==="contact")sendContact(f);else if(k==="review")submitReview(f);else if(k==="track")trackSubmit(f);else if(k==="retreq")submitReturn(f);else if(k==="cancelord")submitCancel(f);else if(k==="delacct")deleteAccount(f);else if(k.startsWith("ac"))acSubmit(k,f)});
function go(f){const cur=new URLSearchParams((location.hash.split("?")[1])||"");const n=new URLSearchParams();if(cur.get("cat"))n.set("cat",cur.get("cat"));const fd=new FormData(f);if(fd.get("q"))n.set("q",fd.get("q"));const sv=fd.get("sort"),def=fd.get("q")?"rel":"pop";if(sv&&sv!==def)n.set("sort",sv);if(fd.get("stock"))n.set("stock","1");location.hash="#/shop"+(n.toString()?"?"+n:"")}
window.addEventListener("hashchange",()=>{closeLayers(true);closeAcct();closeLightbox();render()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAcct();if(e.key==="Escape"&&$("#overlay").classList.contains("show"))closeLayers()});

(async()=>{sbInit();await load();document.documentElement.lang="en";chrome();render()})();

</script>
