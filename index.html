:root{--bg:#faf9f6;--paper:#fff;--ink:#27332b;--muted:#727a73;--sage:#647b67;--sage2:#eaf0e7;--forest:#385a46;--deep:#304b3d;--line:#e6e8e2;--terra:#b56e54;--terra2:#fbeee7;--shadow:0 12px 32px rgba(36,49,36,.08);--r:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
h1,h2,h3.serif{font-family:Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-.03em}
.shell{max-width:1220px;margin:auto;padding:0 24px}
.promo{background:var(--deep);color:#f4f1e6;text-align:center;padding:8px 15px;font-size:12.5px;letter-spacing:.03em}
.promo:empty{display:none}
.header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.headinner{display:flex;align-items:center;gap:28px;min-height:74px}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0}.brand img{height:46px;width:46px;border-radius:12px;object-fit:cover}
.brand strong{display:block;font-family:Georgia,serif;font-size:21px;letter-spacing:-.5px;font-weight:500;line-height:1.1}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.nav{display:flex;gap:24px;align-items:center;flex:1}.nav a{color:#48544a;font-weight:600;font-size:14px}.nav a.active,.nav a:hover{color:var(--terra)}
.actions{display:flex;gap:6px;align-items:center}
.iconbtn{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--sage2)}.iconbtn svg{width:21px;height:21px}
.badge{position:absolute;top:2px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--terra);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center}.badge:empty{display:none}
.lang{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 9px;font-size:12px;font-weight:800;color:var(--muted)}
.menu{display:none}
.btn{border:1px solid var(--line);background:#fff;padding:11px 18px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s;white-space:nowrap}
.btn:hover{box-shadow:var(--shadow);transform:translateY(-1px)}.btn.primary{background:var(--forest);border-color:var(--forest);color:#fff}.btn.terra{background:var(--terra);border-color:var(--terra);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.btn.block{width:100%}.btn.danger{color:#a3412b}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent}
/* hero */
.hero{background:linear-gradient(105deg,#f1f0e8 0%,#f4f1e9 58%,#e3e9df 100%);padding:56px 0}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:48px}
.eyebrow{text-transform:uppercase;color:#a16e56;letter-spacing:.18em;font-weight:800;font-size:11px}
.hero h1{font-size:clamp(38px,5vw,66px);line-height:1.05;margin:16px 0}.hero p{font-size:17px;color:#5f6b60;max-width:540px;white-space:pre-line}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.hero-art{aspect-ratio:1/0.9;border-radius:24px;overflow:hidden;position:relative;box-shadow:var(--shadow);background:#e9e4da}
.hero-art img{width:100%;height:100%;object-fit:cover}
.hero-note{position:absolute;left:18px;bottom:18px;background:#fffdf6;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;max-width:70%}
.hero-note b{display:block}
.perks{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:26px 0}
.perk{display:flex;gap:12px;align-items:center;font-size:13px;color:#566258}.perk i{font-style:normal;width:40px;height:40px;border-radius:12px;background:var(--sage2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}.perk b{display:block;color:var(--ink);font-size:14px}
.section{padding:56px 0}.section.alt{background:#f1f3ed}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}.section-head h2{font-size:34px;margin:6px 0 0}
.textlink{color:var(--forest);font-weight:800;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.grid.cats{grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.cat{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:.2s;text-align:center}
.cat:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.cat .ph{aspect-ratio:1;background:#efece4}.cat .ph img{width:100%;height:100%;object-fit:cover}
.cat b{display:block;padding:12px 8px 2px;font-size:14px}.cat small{display:block;color:var(--muted);font-size:12px;padding-bottom:12px}
/* product card */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:.2s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card .ph{aspect-ratio:1;background:#efece4;position:relative;overflow:hidden}.card .ph img{width:100%;height:100%;object-fit:cover;transition:.4s}.card:hover .ph img{transform:scale(1.03)}
.card .body{padding:15px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:15.5px;margin:0;font-weight:650;line-height:1.35}
.card .catname{font-size:12px;color:var(--muted)}
.card .bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}
.price{font-weight:800;font-size:17px}.price.sale{color:var(--terra)}.old{color:#9aa19b;text-decoration:line-through;font-size:13px;font-weight:500;margin-left:6px}
.labels{position:absolute;top:12px;left:12px;display:flex;gap:6px;z-index:2}
.label{background:#fff;border-radius:20px;padding:4px 9px;font-size:11px;font-weight:800;box-shadow:0 2px 8px #0001}.label.sale{background:var(--terra);color:#fff}.label.out{background:#5c635d;color:#fff}.label.new{background:var(--forest);color:#fff}
.fav{position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:#fffe;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px #0001}
.fav svg{width:18px;height:18px}.fav.on svg{fill:var(--terra);stroke:var(--terra)}
.addbtn{width:40px;height:40px;border-radius:11px;border:0;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}.addbtn svg{width:19px;height:19px}.addbtn:disabled{background:#c9cec8}
/* page head */
.page-head{background:#eef1ea;padding:40px 0 34px}.page-head h1{font-size:42px;margin:6px 0}.page-head p{color:var(--muted);margin:0;max-width:680px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:6px}.crumbs a:hover{color:var(--terra)}
/* shop */
.shopbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:#fff;border-radius:30px;padding:8px 14px;font-size:13px;font-weight:700}.chip.on{background:var(--forest);border-color:var(--forest);color:#fff}
.field,.shopbar input,.shopbar select{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;min-width:0;width:100%}
.shopbar .search{flex:1;min-width:200px;position:relative}.shopbar .search input{padding-left:38px}.shopbar .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;color:var(--muted)}
.shopbar select{width:auto}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;white-space:nowrap}.check input{width:17px;height:17px;accent-color:var(--forest)}
.empty{text-align:center;padding:60px 20px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:var(--r)}.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
/* product page */
.pdp{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;padding:34px 0 20px}
.gallery .main{aspect-ratio:1;border-radius:20px;overflow:hidden;background:#efece4;border:1px solid var(--line)}.gallery .main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.thumbs button{width:76px;height:76px;padding:0;border-radius:12px;overflow:hidden;border:2px solid transparent;background:#efece4}.thumbs button.on{border-color:var(--forest)}.thumbs img{width:100%;height:100%;object-fit:cover}
.pdp h1{font-size:38px;margin:8px 0 10px;line-height:1.1}
.pdp .pricebox{display:flex;align-items:center;gap:10px;margin:16px 0}.pdp .price{font-size:28px}.pdp .old{font-size:17px}
.stock{font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}.stock:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}.stock.in{color:#3f7a4d}.stock.low{color:#b7792a}.stock.out{color:#8b8f8b}
.lead{color:#566258;font-size:16px}
.buyrow{display:flex;gap:10px;margin:22px 0}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}.qty button{width:40px;height:44px;border:0;background:transparent;font-size:18px}.qty input{width:44px;text-align:center;border:0;outline:0;background:transparent;-moz-appearance:textfield}.qty input::-webkit-inner-spin-button{display:none}
.infobox{border:1px solid var(--line);background:#fff;border-radius:14px;padding:16px 18px;margin-top:14px;font-size:14px;color:#566258;white-space:pre-line}.infobox b{color:var(--ink);display:block;margin-bottom:4px}
.desc{white-space:pre-line;color:#3f4a41}
.specs{width:100%;border-collapse:collapse;font-size:14px}.specs td{padding:9px 0;border-bottom:1px solid var(--line)}.specs td:first-child{color:var(--muted);width:42%}
.tabsec{padding:20px 0 30px;display:grid;grid-template-columns:1.2fr .8fr;gap:48px}.tabsec h2{font-size:26px;margin:0 0 12px}
/* cart */
.cartgrid{display:grid;grid-template-columns:1fr 360px;gap:30px;align-items:start;padding:34px 0 60px}
.line{display:grid;grid-template-columns:88px 1fr auto;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.line img{width:88px;height:88px;border-radius:10px;object-fit:cover;background:#efece4}.line h3{font-size:15px;margin:0 0 4px}.line .unit{font-size:13px;color:var(--muted)}
.line .right{display:flex;flex-direction:column;align-items:end;gap:8px}.line .qty button{width:32px;height:34px}.line .qty input{width:34px}
.linkbtn{border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:0}
.summary{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;position:sticky;top:96px}.summary h3{margin:0 0 14px;font-size:18px}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px}.row.total{border-top:1px solid var(--line);margin-top:8px;padding-top:14px;font-size:18px;font-weight:800}
.muted{color:var(--muted)}.small{font-size:13px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form .full{grid-column:1/-1}
.form label,.lbl{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.field{display:block}textarea.field{min-height:90px;resize:vertical}
.field:focus,.shopbar input:focus,.shopbar select:focus{outline:2px solid #b7c9b4;border-color:#9fb59b}
.req{color:var(--terra)}
.radio{display:flex;flex-direction:column;gap:8px}.radio label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;font-weight:600;cursor:pointer;margin:0}.radio input{accent-color:var(--forest)}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px}
.panel h2{font-size:24px;margin:0 0 16px}
.note{background:var(--terra2);color:#8a5a45;padding:12px 15px;border-radius:12px;font-size:13.5px}
.okbox{background:#e8f1e6;color:#2f5b3a;padding:14px 16px;border-radius:12px}
.prose{max-width:760px;white-space:pre-line;font-size:16px;color:#3f4a41}
/* footer */
footer{background:#2a3c31;color:#d9e1d7;margin-top:30px}.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px;padding:46px 0 30px}footer h4{color:#fff;margin:0 0 12px;font-size:14px}footer a,footer p{display:block;margin:0 0 8px;font-size:14px;color:#c8d3c6}footer a:hover{color:#fff}
.footlogo{font-family:Georgia,serif;font-size:22px;color:#fff;margin-bottom:8px}.copy{border-top:1px solid #ffffff1a;padding:16px 0;font-size:12px;color:#9fb09d;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;pointer-events:none;background:#24332a;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:100;transition:.25s;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px #0003}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}#toast a{color:#f3c9b6;font-weight:800}
/* admin */
.admin{display:grid;grid-template-columns:230px 1fr;gap:26px;padding:28px 0 60px;align-items:start}
.aside{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;position:sticky;top:96px}
.aside a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;font-weight:650;font-size:14px;color:#48544a}.aside a.on{background:var(--sage2);color:var(--forest)}.aside a:hover{background:#f4f6f1}
.aside hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.ahead{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}.ahead h1{font-size:32px;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.stat b{font-size:28px;font-family:Georgia,serif;font-weight:500;display:block}.stat span{color:var(--muted);font-size:13px}
.tablewrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px;border-bottom:1px solid var(--line);background:#fafbf8;white-space:nowrap}.t td{padding:10px 12px;border-bottom:1px solid #f0f1ed;vertical-align:middle}.t tr:last-child td{border-bottom:0}
.t img{width:46px;height:46px;border-radius:9px;object-fit:cover;background:#efece4}.t .nm b{display:block}.t .nm small{color:var(--muted)}
.t input.mini{width:96px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:#fff}.t input.mini.s{width:70px}
.t input.mini:focus{outline:2px solid #b7c9b4}
.t .acts{display:flex;gap:6px;justify-content:flex-end}
.switch{position:relative;width:40px;height:23px;display:inline-block}.switch input{opacity:0;width:0;height:0}.switch span{position:absolute;inset:0;background:#d3d7d1;border-radius:20px;transition:.2s;cursor:pointer}.switch span:before{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+span{background:var(--forest)}.switch input:checked+span:before{transform:translateX(17px)}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#f4f6f1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}.bulk input{width:80px}
.editor{display:grid;grid-template-columns:1.3fr .7fr;gap:20px;align-items:start}.editor .panel{margin-bottom:20px}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.imgbox{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#efece4}.imgbox img{width:100%;height:100%;object-fit:cover}
.imgbox .tools{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:5px;background:linear-gradient(transparent,#0006)}.imgbox .tools button{border:0;background:#fffe;border-radius:7px;width:26px;height:26px;font-size:13px;padding:0}
.imgbox .main-l{position:absolute;top:6px;left:6px;background:var(--forest);color:#fff;font-size:10px;font-weight:800;padding:3px 7px;border-radius:10px}
.drop{border:2px dashed #cdd5ca;border-radius:12px;padding:20px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer;background:#fbfcfa;display:block}.drop:hover,.drop.over{border-color:var(--forest);background:var(--sage2)}
.specrow{display:grid;grid-template-columns:1fr 1.4fr 36px;gap:8px;margin-bottom:8px}
.help{font-size:12.5px;color:var(--muted);margin-top:5px}
.stack>*+*{margin-top:14px}
.steps{counter-reset:s;padding:0;list-style:none}.steps li{counter-increment:s;padding-left:38px;position:relative;margin-bottom:12px}.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--sage2);color:var(--forest);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
@media (max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.cats{grid-template-columns:repeat(3,minmax(0,1fr))}.perks{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
 .nav{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;flex-direction:column;align-items:stretch;gap:0;border-bottom:1px solid var(--line);box-shadow:var(--shadow);padding:8px 16px}
 .nav.open{display:flex}.nav a{padding:13px 4px;border-bottom:1px solid #f0f1ed;font-size:15px}.nav a:last-child{border:0}
 .menu{display:inline-flex}.headinner{gap:10px;justify-content:space-between;min-height:64px}.brand img{width:40px;height:40px}.brand strong{font-size:19px}.brand small{display:none}
 .hero{padding:30px 0}.hero-grid,.pdp,.tabsec,.cartgrid,.editor,.admin{grid-template-columns:1fr}.hero-art{aspect-ratio:16/10}.hero-grid{gap:24px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card .body{padding:11px 12px 12px}.card h3{font-size:14px}.price{font-size:15px}.addbtn{width:36px;height:36px}
 .section{padding:38px 0}.section-head h2{font-size:27px}.page-head{padding:28px 0 24px}.page-head h1{font-size:32px}.pdp h1{font-size:30px}.pdp{gap:24px;padding-top:20px}
 .foot{grid-template-columns:1fr;gap:24px}.form{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.aside{position:static;display:flex;overflow:auto;padding:6px}.aside a{white-space:nowrap}.aside hr{display:none}.summary{position:static}
 .shell{padding:0 16px}.perks{gap:12px}.perk{font-size:12px}
}
@media (max-width:420px){.perks{grid-template-columns:1fr 1fr}.perk i{width:34px;height:34px}.line{grid-template-columns:70px 1fr}.line img{width:70px;height:70px}.line .right{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}}

/* header search (Amazon-style) */
.headinner{gap:22px}
.hsearch{flex:1;min-width:0;display:flex;position:relative;max-width:760px;height:46px;border:2px solid var(--forest);border-radius:12px;background:#fff;transition:box-shadow .15s}
.hsearch:focus-within{box-shadow:0 0 0 4px #b56e5426;border-color:var(--terra)}
.hsearch select{border:0;border-right:1px solid var(--line);background:#f1f3ed;border-radius:10px 0 0 10px;padding:0 8px 0 12px;font-size:13px;font-weight:700;color:#48544a;max-width:150px;cursor:pointer;outline:0}
.hsearch input{flex:1;width:0;border:0;outline:0;padding:0 14px;font-size:16px;background:transparent;min-width:0}
.hsearch input::-webkit-search-cancel-button{cursor:pointer}
.hs-go{width:54px;border:0;background:var(--terra);color:#fff;border-radius:0 9px 9px 0;display:flex;align-items:center;justify-content:center}.hs-go:hover{background:#a45f47}.hs-go svg{width:21px;height:21px}
.hs-drop{position:absolute;top:calc(100% + 8px);left:-2px;right:-2px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 44px rgba(36,49,36,.16);z-index:60;max-height:72vh;overflow:auto;padding:6px}
.hs-label{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--muted);padding:8px 10px 4px}
.hs-label button{border:0;background:none;color:var(--forest);font-weight:700;font-size:12px;padding:0}
.hs-item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:7px 10px;border-radius:10px;cursor:pointer;color:var(--ink)}
.hs-item.on,.hs-item:hover{background:var(--sage2)}
.hs-item img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#efece4}
.hs-item .ic{width:44px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--muted)}.hs-item .ic svg{width:17px;height:17px}
.hs-item .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}.hs-item .tx small{display:block;color:var(--muted);font-size:12px}
.hs-item .pr{font-weight:800;font-size:14px;white-space:nowrap}.hs-item .pr.sale{color:var(--terra)}
.hs-item mark{background:none;color:inherit;font-weight:800}
.hs-item.q .tx{font-weight:600}.hs-item.q .tx em{font-style:normal;color:var(--terra)}
.hs-sep{height:1px;background:var(--line);margin:6px 4px}
.hs-empty{padding:14px 12px;color:var(--muted);font-size:14px}
.navbar{border-top:1px solid var(--line)}.navbar .nav{min-height:44px;gap:28px}
.summary,.aside{top:140px}
@media (max-width:860px){
 .headinner{flex-wrap:wrap;row-gap:0;padding-bottom:12px}.hsearch{order:3;flex-basis:100%;max-width:none;height:44px}
 .hsearch select{max-width:92px;font-size:12px;padding:0 4px 0 8px}
 .navbar{border:0}.navbar .shell{padding:0}.navbar .nav{min-height:0}
 .hs-drop{max-height:60vh}
}
.admin>div,.editor>div{min-width:0}
/* layers */
body.locked{overflow:hidden}
.overlay{position:fixed;inset:0;background:rgba(29,42,34,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:80}.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#fff;z-index:90;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.12)}
.drawer.open{transform:none}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 14px 22px;border-bottom:1px solid var(--line)}.dhead h3{margin:0;font-size:19px;font-family:Georgia,serif;font-weight:500}
.dbody{flex:1;overflow:auto;padding:16px 22px}
.dfoot{border-top:1px solid var(--line);padding:16px 22px 20px;background:#fbfbf9}
.ship{background:#f4f6f1;border-radius:12px;padding:11px 13px;font-size:13px;margin-bottom:14px}.bar{height:6px;background:#e1e6dd;border-radius:6px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--forest);border-radius:6px;transition:width .3s}
.mline{display:grid;grid-template-columns:72px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid #f0f1ed;align-items:start}.mline:last-child{border:0}
.mline img{width:72px;height:72px;border-radius:10px;object-fit:cover;background:#efece4}.mn{display:block;font-weight:650;font-size:14px;line-height:1.3;margin-bottom:2px}.mt{font-size:14px;white-space:nowrap}
.mrow{display:flex;align-items:center;gap:12px;margin-top:8px}
.qty.sm button{width:30px;height:30px;font-size:16px}.qty.sm span{min-width:24px;text-align:center;font-weight:700;font-size:14px}.qty button:disabled{opacity:.35;cursor:default}
/* quick view */
.phw{position:relative}
.qvbtn{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;border:0;background:rgba(255,255,255,.95);color:var(--ink);font-weight:700;font-size:13px;padding:10px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.1);opacity:0;transform:translateY(6px);transition:.2s}
.card:hover .qvbtn,.qvbtn:focus-visible{opacity:1;transform:none}
@media (hover:none){.qvbtn{opacity:1;transform:none;left:auto;right:8px;bottom:8px;padding:7px 10px;font-size:12px}}
.modal{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.show{opacity:1;pointer-events:auto}
.modal .box{position:relative;background:#fff;border-radius:22px;width:100%;max-width:940px;max-height:calc(100vh - 48px);overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:32px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.25);transform:translateY(12px) scale(.98);transition:transform .25s}
.modal.show .box{transform:none}
.qvx{position:absolute;top:10px;right:10px;background:#fff;z-index:3}
.qvg .main{aspect-ratio:1;border-radius:16px;overflow:hidden;background:#efece4}.qvg .main img{width:100%;height:100%;object-fit:cover}
.qvi{padding-top:18px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}.qvi h2{font-size:30px;margin:2px 0 6px;line-height:1.15}.qvi .pricebox{margin:8px 0}.qvi .price{font-size:26px}.qvi .lead{margin:0}.qvi .buyrow{width:100%;margin:16px 0 12px}
/* shop with filters */
.shoplayout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;padding-top:28px;padding-bottom:56px;align-items:start}
.filters{padding-right:4px}
.fhead{display:flex;justify-content:space-between;align-items:center}.fhead h3{margin:0 0 8px;font-size:20px;font-family:Georgia,serif;font-weight:500}
.fgroup{border-top:1px solid var(--line);padding:16px 0}.fgroup h4{margin:0 0 10px;font-size:13px;color:var(--muted)}

.retitem span{flex:1}.retitem select{width:auto;padding:5px 8px}.retreason span{display:flex;flex-direction:column}.retreason small{color:var(--muted);font-size:12.5px}
.retreason:has(input:checked),.retitem:has(input:checked){border-color:var(--forest);background:var(--sage2)}
/* ===== invoice ===== */
.invbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 auto 16px;max-width:860px;flex-wrap:wrap}
.invoice{background:#fff;border:1px solid var(--line);border-radius:14px;padding:36px;max-width:860px;margin:0 auto;font-size:14px;color:#222}
.invh{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:18px}
.invfrom{display:flex;gap:12px;align-items:flex-start}.invfrom img{border-radius:10px}.invname{font:22px Georgia,serif}.invfrom p{margin:4px 0 0;color:#555;font-size:13px}
.invmeta h1{font:600 28px/1 Georgia,serif;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;text-align:right}
.invmeta table{border-collapse:collapse;font-size:13px}.invmeta th{text-align:left;color:#666;font-weight:600;padding:2px 14px 2px 0}.invmeta td{text-align:right;padding:2px 0}
.invparties{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0}.invparties h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#777;margin:0 0 4px}.invparties p{margin:0;font-size:13.5px}
.invitems{width:100%;border-collapse:collapse}.invitems th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#666;border-bottom:1px solid #ccc;padding:8px 6px}
.invitems td{border-bottom:1px solid #eee;padding:9px 6px;vertical-align:top}.invitems .num{text-align:right;white-space:nowrap}.invitems small{color:#777}
.invtot{margin:14px 0 0 auto;border-collapse:collapse;min-width:300px}.invtot th{text-align:left;font-weight:500;color:#555;padding:4px 20px 4px 0}.invtot td{text-align:right;padding:4px 0;white-space:nowrap}
.invtot .grand th,.invtot .grand td{font-weight:800;font-size:16px;color:#111;border-top:2px solid #222;padding-top:8px}
.invfoot{margin-top:26px;padding-top:14px;border-top:1px solid #ddd;font-size:12.5px;color:#666}
@media (max-width:640px){.invoice{padding:18px}.invparties{grid-template-columns:1fr}.invmeta h1{text-align:left}.invtot{min-width:0;width:100%}}
@media print{body.invoice-mode>*:not(#app){display:none!important}body.invoice-mode #app>*:not(.invpage),.noprint,#chatBtn,#chatPanel{display:none!important}
 body.invoice-mode{background:#fff}.invpage{padding:0!important;max-width:none}.invoice{border:0;padding:0;max-width:none}@page{margin:14mm}}
/* ===== Seller Central · Повернення ===== */
.retcard{margin-bottom:14px}.retcard-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
.retgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
.retmedia{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}.retmedia img,.retmedia video{width:120px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#f4f4f1}
.retacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.retcard textarea{margin-top:12px;min-height:60px}
.retmail{margin-top:10px;font-size:13px;color:var(--muted)}
@media (max-width:760px){.retgrid{grid-template-columns:1fr}}
.invoice.pdfmode{border:0;border-radius:0;max-width:760px;padding:8px}.invitems tr{page-break-inside:avoid}
.invtot tr.due th,.invtot tr.due td{font-weight:800;color:#a3412b}.invnote{margin:14px 0 0;padding:10px 12px;background:#fbeee7;border-radius:8px;font-size:13px;color:#7a3b26}
@media (max-width:900px){.invparties{grid-template-columns:repeat(2,1fr)}}
/* ===== Seller Central · supplier ===== */
.supadd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 14px}
.supadd .field{width:auto;flex:1 1 160px;padding:8px 10px}.supadd b{font-size:14px}.supadd .help{flex-basis:100%;margin:0}
small.supsku{display:block;color:var(--muted);font-size:11.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.supgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:14px}
.supcard{padding:18px;display:flex;flex-direction:column;gap:10px}.supcard-h{display:flex;justify-content:space-between;gap:10px;align-items:center}.supcard-h b{font-size:16px}
.supmeta{display:grid;gap:3px;color:#3d4741}.supstats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.fav-inline.on svg{fill:var(--terra);stroke:var(--terra)}
</style></head>

privacyText:"Last updated: November 24, 2026\n\nThis Privacy Policy explains how {store} (\"we\", \"us\") collects, uses and protects your personal information when you visit {site} or buy from us. {store} is operated by [Business legal name], {address}.\n\n## Information we collect\n- **Contact details** you give us: name, email, phone number and shipping address when you place an order, create an account, send us a message or chat with us.\n- **Chat messages** you send through the chat on our site.\n- **Order details:** the products you buy, order totals and delivery information.\n- **Account details:** your email and a password (stored securely and never visible to us), plus any saved address.\n- **Reviews** you choose to publish, shown with the name you enter.\n- **Basic technical data** your browser sends automatically (such as device and browser type).\n\nYour cart, wishlist and recent searches are saved only in your own browser.\n\n## How we use your information\n- To process, ship and deliver your orders and handle returns.\n- To reply to your questions (by chat or email) and send messages about your order.\n- To run your account and keep the store secure.\n- To meet our legal, tax and accounting obligations.\n\nWe do not sell or rent your personal information, and we do not share it for cross-context behavioral advertising.\n\n## Who we share it with\nOnly with service providers that help us run the store, and only as needed: our hosting and database provider, our payment provider (we never see or store your full card number), and shipping carriers (name, address and phone for delivery). We may also disclose information if the law requires it.\n\n## Cookies and similar technology\nWe use your browser's local storage for essential features such as your cart and sign-in. We don't currently use advertising cookies. If we add analytics or advertising tools, we will update this policy and ask for your consent where required.\n\n## How long we keep it\nWe keep order records for as long as needed for tax and accounting purposes (usually up to 7 years). You can ask us to delete your account at any time.\n\n## Your rights\nYou can ask us to access, correct or delete your personal information, or to stop sending you marketing messages. California residents have additional rights under the CCPA/CPRA, including the right to know what we collect and the right not to be discriminated against for using these rights. To make a request, email us at {email}. We will respond within 45 days.\n\n## Children\nOur store is not directed to children under 13, and we do not knowingly collect their information.\n\n## Changes\nWe may update this policy from time to time. The date at the top shows the latest version.\n\n## Contact\nQuestions about privacy? Email {email}.",
termsText:"Last updated: November 24, 2026\n\nThese Terms of Service apply to your use of {store} at {site} and to any purchase you make from us. {store} is operated by [Business legal name], {address}. By using the site or placing an order, you agree to these terms.\n\n## Products and pricing\nWe try to describe and photograph every product accurately. Colors may look slightly different on your screen, and handmade items can vary a little from piece to piece. Prices are shown in U.S. dollars and may change at any time. If a product is listed at an incorrect price, we may cancel the order and refund you in full.\n\n## Orders\nYour order is an offer to buy. We accept it when we confirm it or ship it. We may refuse or cancel an order — for example, if an item is out of stock, the price was wrong, or we suspect fraud. If we cancel after you've paid, you'll get a full refund.\n\n## Payment\nPayment is due when you place your order unless we agree otherwise. Applicable sales tax may be added at checkout.\n\n## Shipping\nWe ship within the United States. Delivery times are estimates and are not guaranteed. Risk of loss passes to you when the package is delivered to the carrier-confirmed address. See Shipping & payment for details.\n\n## Returns\nReturns and refunds are covered by our Returns & Refunds policy.\n\n## Your account\nKeep your password safe. You are responsible for activity on your account. Let us know right away at {email} if you think someone else has used it.\n\n## Reviews and content\nIf you post a review, you confirm it reflects your genuine experience, and you give us permission to display it on our site. We may remove content that is false, offensive or unrelated to the product.\n\n## Intellectual property\nThe site's text, photos, logo and design belong to {store} or its licensors and may not be copied without permission.\n\n## Limitation of liability\nTo the fullest extent permitted by law, our total liability for any claim related to a purchase is limited to the amount you paid for that order. We are not liable for indirect or consequential damages. Nothing in these terms limits rights you have under consumer protection law.\n\n## Governing law\nThese terms are governed by the laws of the State of [State], USA.\n\n## Changes\nWe may update these terms. The version posted when you place an order applies to that order.\n\n## Contact\n{email}",
returnsText:"Last updated: November 25, 2026\n\nWe want you to love what you ordered. If something isn't right, here's how returns work.\n\n## 14-day returns\nYou can return items within **14 days of delivery**. Start your return in your account: **My orders → Return items**. If you checked out as a guest, email us at {email} with your order number (it starts with CHV-).\n\n## Reasons for return\n- Found a better price\n- Item arrived in poor condition\n- Defective item\n- Doesn't look as expected\n\n## Return conditions\n- Add **photos or a video** of the item and its packaging to your request. For a defect or damage, please show it clearly.\n- Items must be unused and keep their original condition and appearance, in the **original packaging** with all tags, parts and accessories.\n- Please report items damaged in transit within 48 hours of delivery.\n\n## Who pays for return shipping\n- **Defective item or item arrived in poor condition** — the return is **free**. We'll email you a prepaid return label and refund the item price plus the original shipping.\n- **Found a better price or doesn't look as expected** — return shipping is **paid by you**, and original shipping charges aren't refundable.\n\n## Items we can't accept\n- Candles that have been burned\n- Items that show signs of use, or damage that happened after delivery\n- Final-sale items (marked as such on the product page)\n\n## How it works\n- Send your request from **My orders** with the items, the reason and photos or a video.\n- We'll review it and reply by email within 1–2 business days with instructions.\n- Pack the items in their original packaging and ship them back. Please keep your tracking number.\n- Once we receive and check your return, we'll refund the item price and the sales tax paid on it to your original payment method within 5 business days. Your bank may take a few more days to show it.\n\n## Exchanges\nThe quickest way to get a different color or size is to return the item and place a new order.\n\n## Questions\nEmail {email} — we're happy to help.",

 }

 schedule(){clearTimeout(this.timer);if(!this.key)return;this.timer=setTimeout(()=>this.poll(),document.hidden?120000:this.isOpen?4000:40000)},

  try{const{data,error}=await sb.rpc("chat_fetch",{p_key:this.key,p_after:this.last});
   if(!error&&data){const n=(data.messages||[]).filter(m=>!this.msgs.some(x=>x.id===m.id));
    if(data.status==="none"&&!n.length&&this.msgs.length){/* conversation was deleted by the shop */this.key=null;this.msgs=[];this.last=0;LS.set("chatKey",null);LS.set("chatMsgs",[]);if(this.isOpen)this.render();this.badge();return}
    if(n.length){this.msgs=this.msgs.concat(n).slice(-150);this.last=this.msgs.reduce((m,x)=>Math.max(m,x.id||0),0);LS.set("chatMsgs",this.msgs);if(this.isOpen){this.drawList();this.markSeen()}this.badge()}}}catch(e){}

  p.innerHTML=`<header class="chead">${logo?`<img src="${esc(logo)}" alt="">`:""}<div><b>${esc(st.name)}</b><small>${st.hours?"We reply "+esc(st.hours):"We usually reply within a few hours"}</small></div><button type="button" class="iconbtn" data-chatclose aria-label="Close chat">${X}</button></header>
  <div class="clist" id="chatList" aria-live="polite"></div>
  <form class="cform" novalidate>${first?`<div class="cfields"><input class="field" name="name" maxlength="80" placeholder="Your name" autocomplete="name" value="${esc(nm)}"><input class="field" name="email" type="email" maxlength="200" placeholder="Email (so we can reply if you leave)" autocomplete="email" value="${esc(em)}"></div>`:""}
  <div class="crow"><textarea class="field" name="body" rows="1" maxlength="2000" placeholder="Type your message…" aria-label="Message"></textarea><button class="btn primary" aria-label="Send">Send</button></div><div class="cerr" id="chatErr"></div></form>`;
  this.drawList()},

  if(!body)return;const email=String(fd.email||"").trim(),name=String(fd.name||"").trim();
  if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){err.textContent="Please check your email address.";return}
  if(!this.key){this.key=(crypto.randomUUID?crypto.randomUUID():"10000000-1000-4000-8000-100000000000".replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)));LS.set("chatKey",this.key)}

function cartLines(){return cart.map(l=>({...l,k:lkey(l),p:prod(l.id)})).filter(l=>l.p&&l.p.active&&optOk(l,l.p))}

const lineByKey=k=>cart.find(x=>lkey(x)===k);
/* "Buy now": checkout of a single item without touching the cart */
let buyNow=LS.get("buynow",null);
const isBuyNow=()=>/[?&]buy=1/.test(location.hash)&&!!buyNow&&!!prod(buyNow.id);
function coLines(){return isBuyNow()?[{...buyNow,k:lkey(buyNow),p:prod(buyNow.id)}].filter(l=>l.p&&l.p.active&&optOk(l,l.p)):cartLines()}
const coTotal=()=>coLines().reduce((s,l)=>s+l.p.price*l.qty,0);
function startBuyNow(id,q,opt){const p=prod(id);if(!p||p.stock<=0)return;buyNow={id,qty:Math.max(1,Math.min(p.stock,q||1)),...(opt?{opt}:{})};LS.set("buynow",buyNow);closeLayers(true);location.hash="#/checkout?buy=1"}
function cartTotal(){return cartLines().reduce((s,l)=>s+l.p.price*l.qty,0)}
function setCart(c){cart=c;LS.set("cart",cart);badges()}
function addToCart(id,q=1,opt=null){const p=prod(id);if(!p||p.stock<=0)return;
 if(optList(p).length&&!opt){closeLayers(true);location.hash="#/product/"+id;toast("Please choose "+optList(p).map(o=>o.name.toLowerCase()).join(" and "));return}
 const nl={id,qty:0,...(opt?{opt}:{})},k=lkey(nl);let l=lineByKey(k);if(!l){l=nl;cart.push(l)}
 const max=lineMax(l);if(max<=l.qty){if(!l.qty)cart=cart.filter(x=>x!==l);toast(max?"You already have all "+max+" in your cart":"No more in stock");return}
 l.qty=Math.min(max,l.qty+q);setCart(cart);openCart()}

/* ===== search (Amazon-style) ===== */
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const tokens=q=>norm(q).split(/[^a-z0-9\u0400-\u04ff]+/).filter(Boolean);
const stem=w=>w.length>4&&/(ches|shes|xes|sses)$/.test(w)?w.slice(0,-2):w.length>3&&/[^s]s$/.test(w)?w.slice(0,-1):w;
function near(a,b){if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,e=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}if(++e>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}return e+(a.length-i)+(b.length-j)<=1}
function scoreOf(p,toks){
 const c=catOf(p.cat),name=norm(p.name),cat=norm(c?c.name:""),rest=norm([p.short,p.desc,p.sku,...(p.specs||[]).flat()].join(" "));
 const nw=name.split(/[^a-z0-9\u0400-\u04ff]+/).filter(Boolean),aw=(cat+" "+rest).split(/[^a-z0-9\u0400-\u04ff]+/).filter(Boolean);
 let s=0;
 for(const t of toks){let b=0;
  const st=stem(t);
  if(nw.some(w=>w.startsWith(t)||stem(w)===st))b=10;else if(name.includes(t))b=7;else if(cat.includes(t))b=6;else if(aw.some(w=>w.startsWith(t)))b=4;
  else if(aw.some(w=>stem(w)===st))b=4;
  else if(t.length>=4&&nw.concat(cat.split(/[^a-z0-9\u0400-\u04ff]+/)).some(w=>w.length>=4&&((st.length>=4&&near(st,stem(w)))||near(t,w)||near(t,w.slice(0,t.length)))))b=2;
  if(!b)return 0;s+=b}
 if(name.startsWith(toks.join(" ")))s+=5;if(p.stock>0)s+=1;if(p.featured)s+=.5;return s}
function searchProducts(q,cat){const toks=tokens(q);if(!toks.length)return[];return visible().filter(p=>!cat||p.cat===cat).map(p=>[p,scoreOf(p,toks)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>x[0])}
function hl(text,toks){let h=esc(text);toks.filter(t=>t.length>1).forEach(t=>{h=h.replace(new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"\u0001$1\u0002")});return h.replace(/\u0001/g,"<mark>").replace(/\u0002/g,"</mark>")}

function viewShop(q){
 const cat=q.get("cat")||"",raw=(q.get("q")||"").trim(),stock=q.get("stock")==="1",sort=q.get("sort")||(raw?"rel":"pop");
 const min=q.get("min")!==null&&q.get("min")!==""?+q.get("min"):null,max=q.get("max")!==null&&q.get("max")!==""?+q.get("max"):null;
 const key=[...q.entries()].filter(([k])=>k!=="sort").join("&");if(key!==shopKey){shopKey=key;shopShown=12}

 if(sort!=="rel"||!raw)list.sort(by[sort]||by.pop);

 if(min!==null||max!==null)active.push([min!==null&&max!==null?`${money(min)} – ${money(max)}`:min!==null?`${t("over")} ${money(min)}`:`${t("under")} ${money(max)}`,link({min:"",max:""})]);

 <div class="fgroup"><h4>${t("category")}</h4><a class="fopt ${!cat?"on":""}" href="${link({cat:""})}"><span>${t("allCats")}</span><small>${catCount("")}</small></a>${S.categories.map(x=>{const n=catCount(x.id);return `<a class="fopt ${cat===x.id?"on":""} ${n?"":"dim"}" href="${link({cat:x.id})}"><span>${esc(x.name)}</span><small>${n}</small></a>`}).join("")}</div>
 <div class="fgroup"><h4>${t("price")}</h4>${bands.map(bd=>{const on=min===bd[0]&&max===bd[1];return `<a class="fopt ${on?"on":""}" href="${on?link({min:"",max:""}):link({min:bd[0]??"",max:bd[1]??""})}"><span>${bandLabel(bd)}</span><small>${bandCount(bd)}</small></a>`}).join("")}

function shipCfg(){const s=S.settings,n=(v,d)=>{const x=parseFloat(v);return isNaN(x)?d:x},on=v=>v===true||v==="1"||v==="true";

function deliveryOpts(){const c=shipCfg(),L=[{k:"standard",label:"Standard shipping (3–5 business days)",price:c.std}];if(c.expOn)L.push({k:"express",label:"Express shipping (1–2 business days)",price:c.exp});return L}
function shipCost(sub,express){const c=shipCfg();return express&&c.expOn?c.exp:c.std}
function taxRate(st){const r=parseFloat(shipCfg().rates[st]);return isNaN(r)?0:Math.min(20,Math.max(0,r))}
function calcTotals(sub,express,st){const c=shipCfg(),ship=shipCost(sub,express),rate=st?taxRate(st):0,tax=Math.round((sub+(c.taxShip?ship:0))*rate+1e-9)/100;

 return payLine(o)+`<ol class="otrk" aria-label="Order progress">${steps.map(([k,l],i)=>`<li class="${i<idx?"done":i===idx?"cur":""}"${i===idx?' aria-current="step"':""}><span class="dot" aria-hidden="true">${i<idx||(i===idx&&k==="completed")?"✓":""}</span><b>${l}</b>${k==="new"&&o.created_at?`<small>${fmtDate(o.created_at)}</small>`:k==="shipped"&&o.shipped_at?`<small>${fmtDate(o.shipped_at)}</small>`:k==="completed"&&o.delivered_at?`<small>${fmtDate(o.delivered_at)}</small>`:k==="completed"&&o.delivery_eta?`<small>Expected ${fmtDay(o.delivery_eta)}</small>`:""}</li>`).join("")}</ol>
 ${o.status!=="completed"&&o.delivery_eta?`<div class="otrk-eta">📅 Estimated delivery: <b>${fmtDay(o.delivery_eta)}</b></div>`:o.status==="completed"&&o.delivered_at?`<div class="otrk-eta">✓ Delivered on <b>${fmtDate(o.delivered_at)}</b></div>`:""}
 ${o.tracking_number||o.carrier&&idx>=2?`<div class="otrk-num">${o.carrier?`Shipped with <b>${esc(enVal(o.carrier))}</b>`:"Tracking number"}${o.tracking_number?`${o.carrier?" · ":": "}<b>${esc(o.tracking_number)}</b>`:""}${tu?` <a class="btn sm" href="${esc(tu)}" target="_blank" rel="noopener">Track package ↗</a>`:""}</div>${!tu&&idx<3?`<p class="small muted" style="margin:6px 0 0">This delivery service doesn’t offer online tracking. We’ll update the status here once it’s delivered.</p>`:""}`:idx<2?`<p class="small muted" style="margin:8px 0 0">We’ll add a tracking number here as soon as your order ships (usually within 1–2 business days).</p>`:""}`}
function viewTrack(q){
 const lo=LS.get("lastOrder",null),no=q.get("no")||"",em=(lo&&lo.no===no&&lo.c&&lo.c.email)||(user&&user.email)||"";
 if(no&&em)setTimeout(()=>{const f=$('[data-form="track"]');f&&f.requestSubmit()},0);
 return `<div class="page-head"><div class="shell"><div class="crumbs"><a href="#/">${t("home")}</a> / Track your order</div><h1>Track your order</h1><p>Enter your order number and the email you used at checkout.</p></div></div>
 <div class="shell section" style="max-width:760px"><form class="panel stack" data-form="track" novalidate><div class="form"><div><label>Order number <span class="req">*</span></label><input class="field" name="no" placeholder="CHV-261124-1234" value="${esc(no)}" autocomplete="off" required></div><div><label>${t("email")} <span class="req">*</span></label><input class="field" name="email" type="email" autocomplete="email" value="${esc(em)}" required></div></div>
 <button class="btn primary">Find my order</button>${user?`<p class="small muted" style="margin:0">Signed in? All your orders are in <a class="textlink" href="#/account/orders">My orders</a>.</p>`:""}</form><div id="trackRes"></div></div>`}
async function trackSubmit(f){
 const no=String(f.no.value||"").trim(),email=String(f.email.value||"").trim(),box=$("#trackRes");
 if(!no||!email){box.innerHTML=`<div class="note" style="margin-top:14px">Please enter your order number and email.</div>`;return}
 if(!sb){box.innerHTML=`<div class="note" style="margin-top:14px">Tracking is unavailable right now. Please contact us.</div>`;return}
 const b=f.querySelector("button.primary");b.disabled=true;const{data,error}=await sb.rpc("track_order",{p_no:no,p_email:email});b.disabled=false;
 if(error||!data){box.innerHTML=`<div class="note" style="margin-top:14px">We couldn’t find an order with that number and email. Please check both — the order number is in your confirmation and starts with CHV-.</div>`;return}
 box.innerHTML=`<div class="panel" style="margin-top:16px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><span class="eyebrow">Order ${esc(data.order_no)}</span><div class="muted small">Placed ${fmtDate(data.created_at)}${data.delivery?" · "+esc(data.delivery):""}</div></div><b>${money(data.total)}</b></div>
 ${orderTracker(data)}<div class="otrk-items">${(data.items||[]).map(i=>`<div class="row small"><span>${esc(i.name)}${i.opt?` <span class="muted">(${esc(optStr(i.opt,prod(i.id)))})</span>`:""} × ${+i.qty||0}${(prod(i.id)||{}).sku?` <span class="muted">· Item # ${esc(prod(i.id).sku)}</span>`:""}</span><span>${money((+i.price||0)*(+i.qty||0))}</span></div>`).join("")}</div>
 <p class="small muted" style="margin:12px 0 0">Questions about this order? <a class="textlink" href="#/contacts">Contact us</a> and include your order number.</p></div>`}
/* ===== reviews on the product page ===== */
function reviewsHtml(p){
 const R=revsOf(p.id).slice().sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at)),r=rating(p.id);
 const dist=[5,4,3,2,1].map(s=>[s,R.filter(x=>+x.rating===s).length]);
 return `<section class="reviews" id="reviews"><h2>Customer reviews</h2><div class="revgrid"><div class="revsum">${r?`<div class="revbig">${r.avg.toFixed(1)}<small> out of 5</small></div>${stars(r.avg,22)}<p class="muted small">${r.n} ${r.n===1?"review":"reviews"}</p>${dist.map(([s,n])=>`<div class="distrow"><span>${s} star</span><div class="bar"><i style="width:${r.n?Math.round(n/r.n*100):0}%"></i></div><span class="muted">${r.n?Math.round(n/r.n*100):0}%</span></div>`).join("")}`:`<p class="muted" style="margin-top:0">No reviews yet.</p>`}
 <div class="revcta"><h3>Review this product</h3>${revFormHtml(p)}</div></div>
 <div class="revlist">${R.length?R.map(x=>`<article class="rev"><div class="rtop">${stars(+x.rating,15)}${x.title?`<b class="rt">${esc(x.title)}</b>`:""}</div><div class="rmeta">${esc(x.name)}${x.verified?` · <span class="verified">✓ Verified purchase</span>`:""} · ${fmtDate(x.created_at)}</div><p>${esc(x.body)}</p></article>`).join(""):`<div class="empty" style="padding:34px 20px"><b>Be the first to review this product</b>Share what you think with other shoppers.</div>`}</div></div></section>`}
function revFormHtml(p){
 if(!sb)return `<p class="small muted">Reviews are unavailable right now.</p>`;
 if(!user)return `<p class="small">Share your thoughts with other customers.</p><a class="btn block" href="#/account" data-act="revlogin" data-id="${p.id}">Sign in to write a review</a>`;
 const nm=(profile&&profile.full_name)||(user.user_metadata&&user.user_metadata.full_name)||"";
 return `<p class="small">Share your thoughts with other customers.</p><button class="btn block" data-act="revopen">Write a review</button><form class="revform stack" data-form="review" data-id="${p.id}" hidden novalidate>
 <div><label class="lbl">Your rating <span class="req">*</span></label><div class="starpick" role="radiogroup" aria-label="Your rating">${[5,4,3,2,1].map(i=>`<label title="${i} star${i>1?"s":""}"><input type="radio" name="rating" value="${i}"><span aria-hidden="true">★</span><b class="sr">${i} star${i>1?"s":""}</b></label>`).join("")}</div></div>
 <div><label class="lbl">Headline</label><input class="field" name="title" maxlength="120" placeholder="What’s most important to know?"></div>
 <div><label class="lbl">Your review <span class="req">*</span></label><textarea class="field" name="body" maxlength="3000" placeholder="What did you like or dislike? How do you use it?"></textarea></div>
 <div><label class="lbl">Name shown with your review <span class="req">*</span></label><input class="field" name="name" maxlength="60" value="${esc(nm)}" autocomplete="given-name"></div>
 <div id="revMsg"></div><button class="btn primary block">Submit review</button><p class="help" style="margin:0">Reviews appear after a quick check. Please don’t share personal information.</p></form>`}
async function submitReview(f){
 const fd=Object.fromEntries(new FormData(f)),m=$("#revMsg"),rating=+fd.rating,body=String(fd.body||"").trim(),name=String(fd.name||"").trim(),title=String(fd.title||"").trim()||null;
 const err=x=>{m.innerHTML=`<div class="note">${x}</div>`};
 if(!rating)return err("Please choose a star rating.");if(body.length<10)return err("Please write a few more words (at least 10 characters).");if(!name)return err("Please enter the name to show with your review.");
 const b=f.querySelector("button.primary");b.disabled=true;
 const{error}=await sb.from("reviews").insert({product_id:f.dataset.id,rating,title,body,name});b.disabled=false;
 if(error)return err(/duplicate|unique/i.test(error.message)?"You’ve already reviewed this product — thank you!":/TOO_MANY/.test(error.message)?"You’ve posted several reviews today. Please try again tomorrow.":"Couldn’t send your review. Please try again.");
 f.outerHTML=`<div class="okbox">Thank you, ${esc(name.split(" ")[0])}! Your review was sent and will appear here after a quick check.</div>`}

/* ===== legal pages & brand story ===== */
function fillTokens(txt){const s=S.settings;return String(txt||"").replace(/\{store\}/g,s.name||"").replace(/\{email\}/g,s.email||"").replace(/\{address\}/g,String(s.address||"[Business address]").replace(/\s*\n\s*/g,", ")).replace(/\{site\}/g,(typeof SITE_URL!=="undefined"?SITE_URL:location.origin))}
function richText(txt){
 const blocks=fillTokens(txt).replace(/\r/g,"").split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
 const inline=x=>esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/([\w.+-]+@[\w-]+\.[\w.]+)/g,'<a class="textlink" href="mailto:$1">$1</a>');
 const one=b=>{if(!b)return"";if(b.startsWith("## ")){const i=b.indexOf("\n");return `<h2>${inline(i<0?b.slice(3):b.slice(3,i))}</h2>`+(i<0?"":one(b.slice(i+1).trim()))}const L=b.split("\n");if(L.every(l=>/^- /.test(l)))return `<ul>${L.map(l=>`<li>${inline(l.slice(2))}</li>`).join("")}</ul>`;return `<p>${L.map(inline).join("<br>")}</p>`};
 return blocks.map(one).join("")}
function viewLegal(k){const T={privacy:["Privacy Policy","privacyText"],terms:["Terms of Service","termsText"],returns:["Returns & Refunds","returnsText"]}[k];
 return `<div class="page-head"><div class="shell"><div class="crumbs"><a href="#/">${t("home")}</a> / ${esc(T[0])}</div><h1>${esc(T[0])}</h1></div></div><div class="shell section"><div class="legal">${richText(S.settings[T[1]])}</div><p class="small muted" style="margin-top:30px">Other policies: ${[["returns","Returns & refunds"],["privacy","Privacy policy"],["terms","Terms of service"],["delivery","Shipping & payment"]].filter(x=>x[0]!==k).map(([h,l])=>`<a class="textlink" href="#/${h}">${l}</a>`).join(" · ")}</p></div>`}
function viewAbout(){
 const s=S.settings,paras=String(s.aboutStory||s.aboutText||"").replace(/\r/g,"").split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
 const vals=String(s.aboutValues||"").split("\n").map(x=>x.split("|").map(y=>y.trim())).filter(x=>x.length>=2&&x[1]);
 const img=s.aboutImage||s.heroImage||PHOTO.hero;
 return `<section class="about-hero"><div class="shell about-grid"><div><span class="eyebrow">Our story</span><h1>${esc(s.aboutTitle||"About us")}</h1>${s.aboutIntro?`<p class="lead">${esc(s.aboutIntro)}</p>`:""}<div class="hero-cta"><a class="btn primary" href="#/shop">Shop the collection →</a><a class="btn" href="#/contacts">Say hello</a></div></div><div class="about-img"><img src="${esc(img)}" alt=""></div></div></section>
 ${paras.length?`<section class="section"><div class="shell about-story">${paras.map((p,i)=>i===0?`<p class="first">${esc(p)}</p>`:`<p>${esc(p)}</p>`).join("")}</div></section>`:""}
 ${vals.length?`<section class="section alt"><div class="shell"><div class="section-head"><div><span class="eyebrow">What we care about</span><h2>Our promise to you</h2></div></div><div class="values">${vals.map(([i,ti,tx])=>`<div class="value"><i aria-hidden="true">${esc(i)}</i><b>${esc(ti||"")}</b><p>${esc(tx||"")}</p></div>`).join("")}</div></div></section>`:""}
 <section class="section"><div class="shell about-cta"><h2>${esc(s.aboutCta||"Make your home a little cozier")}</h2><p>Have a question about a product or an order? We read every message — <a class="textlink" href="#/contacts">get in touch</a>.</p><a class="btn primary" href="#/shop">Browse all products →</a></div></section>`}
/* ===== SEO tags (title, description, social preview, product data for Google) ===== */
function setMetaTag(attr,key,val){let m=document.head.querySelector(`meta[${attr}="${key}"]`);if(!m){m=document.createElement("meta");m.setAttribute(attr,key);document.head.appendChild(m)}m.setAttribute("content",val||"")}
function applySeo(parts,q){const st=S.settings,base=st.name||"CozyHouseVibe",clip=(x,n)=>{x=String(x||"").replace(/\s+/g," ").trim();return x.length>n?x.slice(0,n-1).trim()+"…":x};
 let title=st.seoTitle||base+(st.tagline?" — "+st.tagline:""),desc=st.seoDescription||st.heroText||"",img=st.heroImage||"",ld=null;const pg=parts[0]||"";
 if(pg==="product"){const p=prod(parts[1]);if(p&&p.active){title=p.seoTitle||p.name+" | "+base;desc=p.seoDesc||p.short||p.desc||"";img=img0(p);const r=rating(p.id);
  ld={"@context":"https://schema.org","@type":"Product",name:p.name,sku:p.sku||undefined,description:clip(p.desc||p.short,500),image:(p.images||[]).filter(u=>/^https?:/.test(u)).slice(0,5),brand:{"@type":"Brand",name:base},offers:{"@type":"Offer",priceCurrency:"USD",price:String(p.price),availability:"https://schema.org/"+(p.stock>0?"InStock":"OutOfStock"),url:location.href},...(r?{aggregateRating:{"@type":"AggregateRating",ratingValue:r.avg.toFixed(1),reviewCount:r.n}}:{})}}}
 else if(pg==="shop"){const c=catOf(q.get("cat"));title=(c?c.name:"All products")+" | "+base;desc=c?`Shop ${c.name.toLowerCase()} at ${base}: ${clip(desc,110)}`:desc}
 else if(pg){const T={about:"Our story",contacts:"Contact us",delivery:"Shipping & payment",returns:"Returns & refunds",privacy:"Privacy policy",terms:"Terms of service",track:"Track your order"};if(T[pg])title=T[pg]+" | "+base}
 document.title=clip(title,70);desc=clip(desc,160);setMetaTag("name","description",desc);setMetaTag("property","og:title",document.title);setMetaTag("property","og:description",desc);setMetaTag("property","og:type",pg==="product"?"product":"website");if(/^https?:/.test(img))setMetaTag("property","og:image",img);
 let s=document.getElementById("ldjson");if(ld){if(!s){s=document.createElement("script");s.type="application/ld+json";s.id="ldjson";document.head.appendChild(s)}s.textContent=JSON.stringify(ld).replace(/</g,"\\u003c")}else if(s)s.remove()}
function notFound(){return `<div class="shell section"><div class="empty"><b>404</b>${lang==="en"?"Page not found.":"Сторінку не знайдено."}<br><br><a class="btn" href="#/">${t("backHome")}</a></div></div>`}

/* ===== router ===== */
let lastPath="";
function render(){
 const h=location.hash.slice(1)||"/";const[path,qs]=h.split("?");const q=new URLSearchParams(qs||"");const parts=path.split("/").filter(Boolean);
 document.body.classList.toggle("invoice-mode",path.startsWith("/account/invoice"));markNav(path);hsClose();hsSync(path,q);let html;
 html=({"":()=>viewHome(),shop:()=>viewShop(q),product:()=>viewProduct(parts[1]),cart:viewCart,checkout:viewCheckout,order:viewOrder,favorites:viewFavs,account:()=>viewAccount(parts),delivery:()=>viewText(t("delivery"),S.settings.deliveryText),about:viewAbout,contacts:viewContacts,track:()=>viewTrack(q),privacy:()=>viewLegal("privacy"),terms:()=>viewLegal("terms"),returns:()=>viewLegal("returns")}[parts[0]||""]||notFound)();
 if(html!==undefined&&html!=="")app.innerHTML=html;
 if(path!==lastPath)window.scrollTo(0,0);lastPath=path;applySeo(parts,q);
}

 if(e.target.id==="qv"){closeLayers();return}
 if((!e.target.closest("#acctWrap")||e.target.closest("#acctMenu a")))closeAcct();
 const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,id=el.dataset.id;
 const H={

  revopen:()=>{const f=$('[data-form="review"]');if(f){f.hidden=false;el.hidden=true;const s=f.querySelector("input");s&&s.focus()}},
  revlogin:()=>{LS.set("afterLogin","#/product/"+id)},
  "q-":()=>{const i=$("#pq");i.value=Math.max(1,(+i.value||1)-1)},"q+":()=>{const i=$("#pq");i.value=Math.min(+i.max||99,(+i.value||1)+1)},

  hsclear:()=>{e.preventDefault();LS.set("recent",[]);hsClose();hsIn().focus()},
  cart:()=>{e.preventDefault();openCart()},
  acctmenu:()=>{e.preventDefault();const w=$("#acctWrap"),o=!w.classList.contains("open");w.classList.toggle("open",o);el.setAttribute("aria-expanded",String(o))},
  pw:()=>{const i=el.parentNode.querySelector("input");i.type=i.type==="password"?"text":"password";el.textContent=i.type==="password"?"Show":"Hide"},
  signout:async()=>{await sb.auth.signOut();profile=null;toast("Signed out");location.hash="#/account"},
  cologin:()=>{LS.set("afterLogin","#/checkout")},
  filters:()=>openLayer("filters"),
  more:()=>{shopShown+=12;render()},
  closeall:()=>{e.preventDefault();closeLayers()},
  qv:()=>{e.preventDefault();quickView(id)},
  qvq:()=>{const i=$("#qvq");i.value=Math.max(1,Math.min(+i.max||99,(+i.value||1)+ +el.dataset.d))},
  qvadd:()=>{const r=readOpts(prod(id),"qv");if(r.ok)addToCart(id,Math.max(1,parseInt($("#qvq").value)||1),r.opt)},

  mrm:()=>{const k=el.dataset.k;setCart(cart.filter(l=>lkey(l)!==k));renderMini();if(/^#\/(cart|checkout)/.test(location.hash))render()},
  copyorder:()=>{copy($("#otext").value)},

  invprint:()=>window.print(),
  invpdf:()=>downloadInvoice(el),
  tg:()=>{copy($("#otext").value);window.open("https://t.me/"+el.dataset.u,"_blank")},
 };
 if(H[a])H[a]();
});
document.addEventListener("change",e=>{
 {const f=e.target.form;if(f&&f.dataset.form==="checkout"&&(e.target.name==="state"||e.target.name==="delivery")){const sm=$("#coSum");if(sm)sm.outerHTML=summary(false,f.state.value,/express/i.test((f.querySelector("[name=delivery]:checked")||{}).value||""))}}
 const el=e.target;
 if(el.dataset.act==="sortchange"){const f=el.form;go(f)}
 else if(el.dataset.act==="fsort"){const raw=new URLSearchParams(location.hash.split("?")[1]||"").get("q");setParams({sort:el.value===(raw?"rel":"pop")?"":el.value})}
 else if(el.dataset.act==="fstock"){closeLayers(true);setParams({stock:el.checked?"1":""})}
 else if(el.dataset.act==="cqi"){const l=lineByKey(el.dataset.k);if(!l)return;l.qty=Math.max(1,Math.min(lineMax(l),parseInt(el.value)||1));setCart(cart);render()}
 else if(el.dataset.act==="optpick"){const fs=el.closest(".optset");if(fs)fs.querySelector(".optval").textContent=el.value;const b=el.closest(".opts");b&&b.classList.remove("need")}

document.addEventListener("submit",e=>{const f=e.target;const k=f.dataset.form;if(!k)return;e.preventDefault();
 if(k==="shopsearch")go(f);else if(k==="price"){const mn=f.min.value.trim(),mx=f.max.value.trim();let lo=mn===""?"":Math.max(0,+mn),hi=mx===""?"":Math.max(0,+mx);if(lo!==""&&hi!==""&&lo>hi)[lo,hi]=[hi,lo];closeLayers(true);setParams({min:lo,max:hi})}else if(k==="checkout")placeOrder(f);else if(k==="contact")sendContact(f);else if(k==="review")submitReview(f);else if(k==="track")trackSubmit(f);else if(k==="retreq")submitReturn(f);else if(k.startsWith("ac"))acSubmit(k,f)});
function go(f){const cur=new URLSearchParams((location.hash.split("?")[1])||"");const n=new URLSearchParams();if(cur.get("cat"))n.set("cat",cur.get("cat"));const fd=new FormData(f);if(fd.get("q"))n.set("q",fd.get("q"));const sv=fd.get("sort"),def=fd.get("q")?"rel":"pop";if(sv&&sv!==def)n.set("sort",sv);if(fd.get("stock"))n.set("stock","1");location.hash="#/shop"+(n.toString()?"?"+n:"")}
